<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order a Drink · Host Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1b0a26;--bg2:#0e2a22;--card:rgba(52,16,64,.72);--ink:#fbf1dc;--mute:#cdb6d6;--gold:#e8c35a;--plum:#7b2a86;--magenta:#d93aa7;--orange:#f08a24;--blue:#3d7be0;--line:rgba(232,195,90,.45);--ok:#7be0a8}
*{box-sizing:border-box}
html{background:#0e2a22}
body{margin:0 auto;min-height:100vh;max-width:520px;padding:18px 16px 40px;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;background:radial-gradient(circle at 50% -10%,rgba(240,138,36,.28),transparent 45%),linear-gradient(170deg,var(--bg1),var(--bg2))}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:52px;line-height:1.05;margin:6px 0 2px;text-align:center;background:linear-gradient(90deg,var(--magenta),var(--orange),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h2,h3{color:var(--gold);font-weight:700;letter-spacing:.04em;margin:16px 0 8px}
.sub{text-align:center;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:13px;margin:0 0 16px}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs button{flex:1}
button,input{font:inherit}
button{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
button.on,button.pri{background:linear-gradient(90deg,var(--plum),var(--magenta));border-color:var(--gold);color:#fff}
button:disabled{opacity:.45}
input[type=text],input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(14,6,20,.55);color:var(--ink);font-size:20px}
input::placeholder{color:#a98fb5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.drink{width:100%;text-align:left;display:block;margin-bottom:10px;font-size:24px;font-weight:700;padding:16px;border-left:6px solid var(--magenta)}
.drink:nth-child(2){border-left-color:var(--orange)}
.drink:nth-child(3){border-left-color:var(--blue)}
.drink:nth-child(4){border-left-color:var(--gold)}
.tag{font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:1px 10px;margin-left:8px;letter-spacing:.08em;font-weight:500;vertical-align:middle}
.mute{color:var(--mute);font-size:16px}
.st{font-weight:700;color:var(--ok)}
.note{font-size:14px;color:var(--mute);text-align:center;margin:8px 0}
.hide{display:none}
label{color:var(--mute)}
</style>
</head>
<body>
<h1>Order a Drink</h1>
<p class="sub">Pick your drink &middot; we will bring it to your table</p>
<div class="tabs"><button id="tg" class="on">Guest</button><button id="tb">Bartender</button></div>
<div id="note" class="note"></div>

<section id="guest">
  <div class="card">
    <label class="mute">Your table number</label>
    <input type="number" id="table" inputmode="numeric" min="1" placeholder="e.g. 7">
  </div>
  <div id="menu"></div>
  <div id="mine"></div>
</section>

<section id="bar" class="hide">
  <h2 style="margin:0 0 8px">Incoming orders</h2>
  <div id="queue"></div>
  <h2 style="margin:18px 0 8px">Drink menu</h2>
  <div id="edit"></div>
  <div class="card">
    <input type="text" id="newname" placeholder="New drink name">
    <div class="row" style="margin-top:8px"><label><input type="checkbox" id="newspiked"> Spiked</label><button class="pri" id="add">Add drink</button></div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* STEP 1: paste your Firebase settings below, replacing the placeholder values */
var FIREBASE_CONFIG={apiKey:"AIzaSyAMWgxbGsq4yiQrsuLYJ1pEb5Qc-8o4zg0",authDomain:"spark-drinks-2d185.firebaseapp.com",databaseURL:"https://spark-drinks-2d185-default-rtdb.firebaseio.com",projectId:"spark-drinks-2d185",appId:"1:497288236361:web:468bd29601daa92e621e98"};
/* STEP 2: choose your bartender PIN */
var BARTENDER_PIN="1234", barOK=false;
var DEFAULT_MENU=[{name:"Enchanted Bloom",spiked:false,out:false},{name:"Sunlit Rose",spiked:false,out:false},{name:"Velvet Spark",spiked:true,out:false}];
var menu=DEFAULT_MENU.slice(), orders=[], myIds=[], db=null;
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function render(){
  var m="";
  menu.forEach(function(d,i){
    m+='<button class="drink" data-i="'+i+'"'+(d.out?' disabled':'')+'>'+esc(d.name)+(d.spiked?'<span class="tag">spiked</span>':'')+(d.out?' <span class="mute">(sold out)</span>':'')+'</button>';
  });
  $("menu").innerHTML=m;
  var mine=orders.filter(function(o){return myIds.indexOf(o.id)>-1}).sort(function(a,b){return b.ts-a.ts});
  $("mine").innerHTML=mine.length?'<h3>Your orders</h3>'+mine.map(function(o){return '<div class="card row"><span>'+esc(o.drink)+' &middot; Table '+esc(String(o.table))+'</span><span class="st">'+esc(o.status)+'</span></div>'}).join(""):"";
  var open=orders.filter(function(o){return o.status!=="Delivered"}).sort(function(a,b){return a.ts-b.ts});
  $("queue").innerHTML=open.length?open.map(function(o){
    return '<div class="card"><div class="row"><b>'+esc(o.drink)+'</b><span>Table '+esc(String(o.table))+'</span></div><div class="mute">'+esc(o.status)+'</div><div class="row" style="margin-top:8px">'+
    ["Being made","Ready","Delivered"].map(function(s){return '<button data-o="'+o.id+'" data-s="'+s+'">'+s+'</button>'}).join("")+'</div></div>';
  }).join(""):'<p class="mute">No open orders yet.</p>';
  $("edit").innerHTML=menu.map(function(d,i){
    return '<div class="card row"><span>'+esc(d.name)+(d.spiked?'<span class="tag">spiked</span>':'')+'</span><span><button data-t="'+i+'">'+(d.out?'Back in':'Sold out')+'</button> <button data-r="'+i+'">Remove</button></span></div>';
  }).join("");
}

function saveMenu(){
  if(db){try{db.ref("menu").set(menu)}catch(e){}}
  render();
}
function saveOrder(o){
  if(db){try{db.ref("orders/"+o.id).set(o)}catch(e){}}
  else{var k=orders.findIndex(function(x){return x.id===o.id});if(k>-1)orders[k]=o;else orders.push(o)}
  render();
}

$("tg").onclick=function(){$("guest").classList.remove("hide");$("bar").classList.add("hide");$("tg").className="on";$("tb").className=""};
$("tb").onclick=function(){if(!barOK){var p=prompt("Bartender PIN");if(p!==BARTENDER_PIN)return;barOK=true}$("bar").classList.remove("hide");$("guest").classList.add("hide");$("tb").className="on";$("tg").className=""};

$("menu").onclick=function(e){
  var b=e.target.closest("button[data-i]");if(!b)return;
  var t=$("table").value.trim();
  if(!t){$("table").focus();alert("Please enter your table number first.");return}
  var d=menu[+b.dataset.i];
  var o={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),drink:d.name,table:t,status:"Received",ts:Date.now()};
  myIds.push(o.id);saveOrder(o);
};
$("queue").onclick=function(e){
  var b=e.target.closest("button[data-o]");if(!b)return;
  var o=orders.find(function(x){return x.id===b.dataset.o});
  if(o){o.status=b.dataset.s;saveOrder(o)}
};
$("edit").onclick=function(e){
  var t=e.target.closest("button[data-t]"),r=e.target.closest("button[data-r]");
  if(t){menu[+t.dataset.t].out=!menu[+t.dataset.t].out;saveMenu()}
  if(r){menu.splice(+r.dataset.r,1);saveMenu()}
};
$("add").onclick=function(){
  var n=$("newname").value.trim();if(!n)return;
  menu.push({name:n,spiked:$("newspiked").checked,out:false});
  $("newname").value="";$("newspiked").checked=false;saveMenu();
};

render();
(function(){
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){$("note").textContent="Demo mode: add your Firebase settings to share orders between phones.";return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    db.ref("menu").on("value",function(x){var v=x.val();if(v){menu=(Array.isArray(v)?v:Object.values(v)).filter(Boolean);render()}});
    db.ref("orders").on("value",function(x){var v=x.val()||{};orders=Object.keys(v).map(function(k){return Object.assign({id:k},v[k])});render()});
  }catch(e){db=null;$("note").textContent="Demo mode: could not connect to Firebase."}
})();
</script>
</body>
</html>
