<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8338f">
<title>Party Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Light garden look: blush ground with the invitation's magenta, orange, gold, blue and green as accents.
   Layout: one column "phone" for guests, wide two-pane console for the moderator, a full TV board for the big screen.
   */
:root{
  color-scheme:light;
  --ground:#f8f2fb; --ground-2:#efe4f7; --card:#ffffff; --line:#dcc6ea;
  --ink:#33163f; --muted:#7a5d86; --violet:#7b3fb8; --mint:#e3f3e6;
  --rose:#e8338f; --flame:#f6892f; --gold:#e0a826; --leaf:#2f8a4c; --sky:#3f74d6;
  --bad:#e0475b;
  --f-script:"Great Vibes","Brush Script MT",cursive;
  --f-caps:"Marcellus","Trajan Pro",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(900px 420px at 50% -160px,color-mix(in srgb,var(--rose) 24%,transparent),transparent 70%),
  radial-gradient(650px 520px at -10% 35%,color-mix(in srgb,var(--violet) 22%,transparent),transparent 70%),
  radial-gradient(700px 520px at 110% 70%,color-mix(in srgb,var(--flame) 18%,transparent),transparent 70%),
  radial-gradient(900px 560px at 40% 115%,color-mix(in srgb,var(--leaf) 30%,transparent),transparent 70%),
  radial-gradient(500px 400px at 100% 0%,color-mix(in srgb,var(--leaf) 16%,transparent),transparent 70%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand h1{font-family:var(--f-script);font-weight:400;font-size:2.5rem;line-height:1;margin:0;
  background:linear-gradient(90deg,var(--rose),var(--flame) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;font-family:var(--f-caps);letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--leaf)}
.seg{display:inline-flex;background:var(--ground-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--rose);color:#fff}
h2{color:var(--violet);font-family:var(--f-caps);font-weight:400;letter-spacing:.06em;font-size:1.3rem;margin:0;text-wrap:balance}
h3{color:var(--leaf);font-family:var(--f-caps);font-weight:400;letter-spacing:.05em;font-size:1.02rem;margin:0}
.eyebrow{font-family:var(--f-caps);text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;color:#b5800f}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--mint) 35%,var(--card)));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 2px 12px color-mix(in srgb,var(--violet) 10%,transparent)}
.btn{border:1px solid var(--line);background:var(--ground-2);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(135deg,var(--rose),var(--flame));border-color:transparent;color:#fff}
.btn.gold{background:var(--gold);color:#2a1530;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.02em}
.pill.a{background:color-mix(in srgb,var(--sky) 16%,transparent);color:#244a96}
.pill.b{background:color-mix(in srgb,var(--flame) 18%,transparent);color:#9a4a0a}
.pill.live{background:var(--rose);color:#fff}
.pill.ok{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:#1e6236}
.pill.warn{background:color-mix(in srgb,var(--gold) 24%,transparent);color:#7a5600}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:#9b1c1c}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
input[type=text],input[type=number],select{background:var(--ground-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input[type=number]{width:70px}
.num{font-variant-numeric:tabular-nums}
/* phone column */
.phone{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tabs{position:sticky;bottom:0;box-shadow:0 -4px 18px color-mix(in srgb,var(--rose) 12%,transparent);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:color-mix(in srgb,#fff 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{border:0;background:none;border-radius:11px;padding:7px 2px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-pressed="true"]{background:var(--ground-2);color:var(--violet)}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.score{font-family:var(--f-caps);font-size:2.4rem;line-height:1;color:var(--rose)}
.livebtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:16px;border-radius:var(--r);border:0;
  background:linear-gradient(135deg,var(--rose),var(--flame));color:#fff}
.livebtn strong{font-family:var(--f-caps);font-weight:400;font-size:1.25rem;letter-spacing:.04em}
.banner{background:var(--gold);color:#2a1530;border-radius:12px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
/* moderator */
.console{display:grid;grid-template-columns:220px 1fr;gap:16px}
.side{display:flex;flex-direction:column;gap:4px}
.side button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.side button[aria-pressed="true"]{background:var(--card);color:var(--violet);box-shadow:inset 3px 0 0 var(--leaf)}
@media (max-width:720px){.console{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side button{white-space:nowrap}.side button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--gold)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.gamelist{display:grid;gap:8px}
.gamerow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ground-2);border:1px solid var(--line)}
.gamerow.on{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.gnum{font-family:var(--f-caps);color:var(--rose);font-size:1.1rem;width:24px;text-align:center}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-caps);font-weight:400;letter-spacing:.08em;font-size:.72rem;text-transform:uppercase;color:var(--leaf)}
.tscroll{overflow-x:auto}
/* team score bar */
.tbar{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tbar>div{padding:10px 12px}
.tbar .ta{background:color-mix(in srgb,var(--sky) 16%,var(--card))}
.tbar .tb{background:color-mix(in srgb,var(--flame) 18%,var(--card));text-align:right}
.tbar b{font-family:var(--f-caps);font-weight:400;font-size:1.6rem;display:block;line-height:1.1}
/* long word */
.lw{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;min-height:300px}
.lw .col{background:color-mix(in srgb,var(--mint) 60%,var(--card));border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.tiles{display:flex;flex-wrap:wrap;gap:5px}
.tile{width:34px;height:38px;border-radius:6px;background:linear-gradient(#fbe7b3,#e9c46a);color:#3a2408;font-family:var(--f-caps);font-size:1.25rem;display:grid;place-items:center;box-shadow:0 2px 0 #9b7a2b;position:relative}
.tile small{position:absolute;right:3px;bottom:1px;font-size:.5rem;font-family:var(--f-body)}
.tile.new{animation:flip .9s cubic-bezier(.2,.8,.3,1.2)}
@keyframes flip{0%{transform:translateY(-30px) rotateY(180deg) scale(1.6);opacity:0}60%{transform:translateY(4px) rotateY(0) scale(1.1);opacity:1}100%{transform:none}}
.names{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:330px}
.names button{text-align:left;border:1px solid transparent;background:var(--card);border-radius:8px;padding:7px 8px;font-size:.82rem;display:flex;justify-content:space-between;gap:4px}
.names button[aria-pressed="true"]{border-color:var(--gold)}
.names button.got{color:var(--leaf)}
.names button.lock{color:var(--muted);text-decoration:line-through}
.opts{display:grid;gap:6px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px;text-align:left;font-weight:600}
.opts button:hover{border-color:var(--gold)}
@media (max-width:520px){.lw{grid-template-columns:1fr 1fr}.lw .col.q{grid-column:1/-1}}
/* crossword */
.cwbox{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);padding:14px;isolation:isolate;
  background:linear-gradient(135deg,color-mix(in srgb,var(--rose) 14%,var(--card)),color-mix(in srgb,var(--violet) 12%,var(--card)) 45%,color-mix(in srgb,var(--leaf) 14%,var(--card)) 80%,color-mix(in srgb,var(--flame) 12%,var(--card)))}
.cwbox .wm{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.16;pointer-events:none}
.cw{display:grid;gap:2px;width:100%;max-width:440px;margin:0 auto;position:relative}
.cell{aspect-ratio:1;position:relative;min-width:0}
.cell input{min-width:0;box-shadow:0 1px 2px color-mix(in srgb,var(--violet) 25%,transparent)}
.cell.blk{background:transparent}
.cell input{width:100%;height:100%;border:1px solid var(--line);border-radius:3px;background:#fff;color:#2a1530;text-align:center;font-weight:700;font-size:clamp(.6rem,3.2vw,1rem);text-transform:uppercase;padding:0}
.cell input.hl{background:#ffe9b8}
.cell input.done{background:#bfe8c9}
.cell .n{position:absolute;top:0;left:2px;font-size:.45rem;color:#6b3d63;pointer-events:none;font-weight:700}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clues ol{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
.clues li{font-size:.82rem;cursor:pointer;padding:3px 5px;border-radius:6px}
.clues li.done{color:var(--leaf);text-decoration:line-through}
.clues li.act{background:var(--mint)}
@media (max-width:420px){.clues{grid-template-columns:1fr}}
/* bingo */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bingo .h{font-family:var(--f-caps);text-align:center;font-size:1.4rem;color:var(--rose)}
.bingo button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--ground-2);font-size:1.15rem;font-weight:700}
.bingo button.m{background:var(--violet);border-color:var(--violet);color:#fff}
.bingo button.free{background:var(--leaf);border-color:var(--leaf);font-size:.7rem;color:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.called{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.called span{font-size:.62rem;text-align:center;padding:3px 0;border-radius:4px;background:var(--ground-2);color:var(--muted)}
.called span.on{background:var(--gold);color:#2a1530;font-weight:700}
.ball{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7df,var(--gold) 60%,#b88a2a);color:#2a1530;display:grid;place-items:center;font-family:var(--f-caps);font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.4)}
/* trivia / superlatives */
.choices{display:grid;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--ground-2);padding:12px 14px;border-radius:12px;text-align:left;font-weight:600}
.choice[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.choice.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 25%,var(--ground-2))}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.votes{display:flex;gap:3px}
.votes i{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
/* hunt */
.hunt{display:grid;gap:8px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--mint) 55%,var(--card));border:1px solid var(--line);border-radius:12px;padding:8px}
.thumb{width:52px;height:52px;border-radius:8px;background:var(--card);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--f-caps);font-size:1.2rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* big screen */
.tv{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:760px){.tv{grid-template-columns:1fr}}
.tv .stage{min-height:360px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--flame) 12%,var(--ground-2)) 70%,color-mix(in srgb,var(--leaf) 14%,var(--ground-2)));border:1px solid var(--line);border-radius:20px;padding:24px}
.tv .stage h2{font-size:2rem}
.huge{font-family:var(--f-caps);font-size:clamp(3rem,10vw,6rem);line-height:1;color:var(--rose)}
.winner{font-family:var(--f-script);font-size:clamp(3rem,9vw,5.5rem);line-height:1;background:linear-gradient(90deg,var(--rose),var(--flame),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.swatches input[type=color]{width:46px;height:46px;border:2px solid var(--line);border-radius:10px;background:none;padding:2px}
.invite{width:100%;max-width:150px;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.demo{font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:4px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2 additions ===== */
:root{--hc-ink:#000}
html.large .wrap{zoom:1.16}
html.hc{--ground:#ffffff;--ground-2:#f1ebf5;--card:#ffffff;--line:#4a2d57;--ink:#000000;--muted:#2c1a35;--mint:#ffffff}
html.hc body{background-image:none}
html.hc .card{background:#fff;box-shadow:none;border-width:2px}
html.hc .pill{outline:1px solid currentColor}
html.hc .muted{color:#2c1a35}
.m0{margin:0}.mt4{margin-top:4px}.mt6{margin-top:6px}.mb12{margin-bottom:12px}.tc{text-align:center}.tl{text-align:left}.tr{text-align:right}.nw{white-space:nowrap}
.db{display:block}.w100{width:100%}.w110{width:110px}.grow{flex:1;min-width:0}.mw0{min-width:0}.mw200{min-width:200px}.as{align-self:flex-start}.asc{align-self:center}.jc{justify-content:center}.top{align-items:flex-start}
.g8{gap:8px}.g16{gap:16px}.tight{gap:4px}.il{display:inline}.brk{word-break:break-all}.bad{color:var(--bad)}
.narrow{max-width:420px;margin:0 auto}
.btn.xs{padding:2px 7px;font-size:.75rem;border-radius:7px}
.btn.big{font-size:1.15rem;padding:14px}
.banner.soft{background:var(--ground-2);color:var(--ink)}
.card.soft{background:var(--ground-2)}
.aa{font-family:var(--f-caps);font-size:1rem;min-width:44px}
header.top{position:relative}
textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0;resize:vertical}
textarea[readonly]{background:var(--ground-2);font-size:.85rem}
.qh{font-family:var(--f-body);font-weight:700;font-size:1.2rem;letter-spacing:0;color:var(--ink)}
.qtext{margin:2px 0 6px;font-weight:600}
.score.sm{font-size:1.6rem}
.winner.sm{font-size:2.6rem}
.hero{grid-template-columns:auto 1fr auto}
.hero-av{border:0;background:none;padding:0;border-radius:50%}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ground-2);overflow:hidden;font-size:16px;line-height:1;vertical-align:middle;flex:none;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.ev-art{width:100%;max-height:160px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.ev-art.big{max-height:200px;width:auto;max-width:100%;align-self:center}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avpick button,.avsel{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer}
.avpick button[aria-pressed="true"],.avsel.on{border-color:var(--rose);box-shadow:0 0 0 2px color-mix(in srgb,var(--rose) 30%,transparent)}
.avsel img{width:100%;height:100%;object-fit:cover}
.avsel input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rxbar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rxbar button{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:1.5rem;padding:8px 0;transition:transform .15s}
.rxbar button:active{transform:scale(.9)}
.rxbar button.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.35)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.album img,.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.ph{border:0;padding:0;background:none;border-radius:10px;overflow:hidden}
.strip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.strip img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-caps);font-weight:400;font-size:1.8rem;color:var(--rose)}
.stats span{font-size:.8rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bd{background:var(--ground-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.bd span{font-size:1.8rem}.bd small{font-size:.72rem;color:var(--muted)}
.wish{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.key span{padding:6px 9px;border-radius:9px;background:var(--ground-2);font-size:.85rem}
.key span.right{background:color-mix(in srgb,var(--leaf) 20%,var(--card));color:#1e6236;font-weight:700;outline:1px solid var(--leaf)}
.keylist{margin:0;padding-left:22px;display:grid;gap:8px}
.keylist li{font-size:.9rem}
.steps{margin:0;padding-left:20px;display:grid;gap:14px}
.steps li{display:flex;flex-direction:column;gap:6px}
.steps input[type=number]{width:70px}

let cwCache={key:null,val:null};
function buildCW(list){
 const key=JSON.stringify(list.map(x=>x.w));if(cwCache.key===key)return cwCache.val;
 const g={},placed=[];const words=list.map(x=>String(x.w||"").toUpperCase().replace(/[^A-Z]/g,"")).filter(w=>w.length>=2);
 const can=(w,r,c,d)=>{const[dr,dc]=d==="A"?[0,1]:[1,0];let k=0;
  if(g[(r-dr)+","+(c-dc)]||g[(r+dr*w.length)+","+(c+dc*w.length)])return -1;
  for(let i=0;i<w.length;i++){const p=[r+dr*i,c+dc*i],ch=g[p];
   if(ch){if(ch!==w[i])return -1;k++}else if(g[(p[0]+dc)+","+(p[1]+dr)]||g[(p[0]-dc)+","+(p[1]-dr)])return -1}return k};
 const put=(w,r,c,d)=>{const[dr,dc]=d==="A"?[0,1]:[1,0];for(let i=0;i<w.length;i++)g[(r+dr*i)+","+(c+dc*i)]=w[i];placed.push({w,r,c,d})};
 const order=words.slice().sort((a,b)=>b.length-a.length);let rest=[];
 if(order.length){put(order[0],0,0,"A");rest=order.slice(1)}
 for(let pass=0;pass<4;pass++){const left=[];for(const w of rest){let best=null;
   for(const key2 of Object.keys(g)){const[pr,pc]=key2.split(",").map(Number),ch=g[key2];
    for(let i=0;i<w.length;i++){if(w[i]!==ch)continue;for(const d of["A","D"]){const r=d==="A"?pr:pr-i,c=d==="A"?pc-i:pc;const k=can(w,r,c,d);if(k>0&&(!best||k>best[0]))best=[k,r,c,d]}}}
   if(best)put(w,best[1],best[2],best[3]);else left.push(w)}rest=left}
 if(!placed.length){cwCache={key,val:{R:0,C:0,placed:[],starts:{},sol:{},unplaced:words}};return cwCache.val}
 const ks=Object.keys(g).map(k=>k.split(",").map(Number));const r0=Math.min(...ks.map(k=>k[0])),c0=Math.min(...ks.map(k=>k[1]));
 const Rr=Math.max(...ks.map(k=>k[0]))-r0+1,Cc=Math.max(...ks.map(k=>k[1]))-c0+1;
 placed.forEach(p=>{p.r-=r0;p.c-=c0;const idx=list.findIndex(x=>String(x.w||"").toUpperCase().replace(/[^A-Z]/g,"")===p.w);p.id=idx;p.item=list[idx]});
 const starts={};let n=0;placed.slice().sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{const k=p.r+","+p.c;if(!starts[k])starts[k]=++n;p.num=starts[k]});
 const sol={};placed.forEach(p=>{for(let i=0;i<p.w.length;i++)sol[p.d==="A"?p.r+","+(p.c+i):(p.r+i)+","+p.c]=p.w[i]});
 cwCache={key,val:{R:Rr,C:Cc,placed,starts,sol,unplaced:rest}};return cwCache.val}
const CWG=()=>buildCW(CWW());
const cellsOf=p=>[...Array(p.w.length)].map((_,i)=>p.d==="A"?p.r+","+(p.c+i):(p.r+i)+","+p.c);
const cwClue=p=>L.lang==="es"&&p.item&&p.item.es?p.item.es:(p.item?p.item.c:"");

/* ---------- bingo ---------- */
function seeded(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function cardFor(id,round){const r=seeded(EV+"|"+id+"|"+round);const cols=[];for(let c=0;c<5;c++){const a=[...Array(15)].map((_,i)=>c*15+i+1);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}cols.push(a.slice(0,5))}cols[2][2]=0;return cols}
function hasBingo(card,isOn){const m=n=>n===0||isOn(n);for(let i=0;i<5;i++){if([0,1,2,3,4].every(j=>m(card[j][i])))return true;if([0,1,2,3,4].every(j=>m(card[i][j])))return true}
 return [0,1,2,3,4].every(j=>m(card[j][j]))||[0,1,2,3,4].every(j=>m(card[j][4-j]))}

const rank=id=>ranked().indexOf(id)+1;

 if(L.recapPhotos===null||L.recapPhotos===undefined){L.recapPhotos=[];const hs=D.mine.hunt||{};Object.keys(hs).filter(k=>hs[k]==="ok").forEach(k=>ER("photos/"+me+"_"+k).once("value").then(s=>{const v=s.val();if(v&&v.img&&!v.removed){L.recapPhotos.push(v.img);renderSoon()}}))}

 return `<section class="card stack tc recap"><div class="eyebrow">${esc(C().title||"")}</div><div class="winner sm">${t("Thanks for celebrating!")}</div>${w?`<p class="m0"><b>${t("{team} won the night!",{team:esc(teamName(w))})}</b></p>`:`<p class="m0"><b>${t("It's a tie!")}</b></p>`}</section>

 <section class="card stack"><h3>${t("Your badges")}</h3>${bs.length?`<div class="badges">${bs.map(k=>`<div class="bd"><span>${BADGES[k].i}</span><b>${esc(L.lang==="es"?BADGES[k].es:BADGES[k].n)}</b></div>`).join("")}</div>`:`<p class="small muted m0">${t("No badges yet. Keep playing!")}</p>`}</section>
 ${L.recapPhotos.length?`<section class="card stack"><h3>${t("Your hunt photos")}</h3><div class="album">${L.recapPhotos.map(s=>`<img src="${s}" alt="">`).join("")}</div></section>`:""}
 <a class="btn primary tc" href="${esc(eventURL(EV,"album"))}" target="_blank" rel="noopener">${t("See the shared album")}</a>${reactBar()}`}

function pLive(){

/* Long Word Wins */
function myTiles(){const lw=D.mine.lw||{},got=lw.got||{};const out=[{l:P(L.me).word[0],from:"your word"}];Object.keys(got).sort((a,b)=>(+got[a]||0)-(+got[b]||0)).forEach(id=>{if(D.players[id])out.push({l:P(id).word[0],from:P(id).name})});return out}
function gLong(){
 const lw=D.mine.lw||{},got=lw.got||{},lock=lw.lock||{},end=st().lwEnd,over=end&&now()>end;
 const timer=end?(over?`<span class="pill no">${t("Time's up")}</span>`:`<span class="pill warn num" data-timer="${end}">${fmtLeft(end)}</span>`):`<span class="pill warn">${t("Waiting for the timer")}</span>`;
 const tiles=myTiles().map((x,k,a)=>`<div class="tile ${k===a.length-1&&L.lwNew===k?"new":""}" title="${esc(x.from)}">${x.l}<small>1</small></div>`).join("");
 const names=ids().filter(i=>i!==L.me).map(i=>{const cls=got[i]?"got":lock[i]?"lock":"";return `<button class="${cls}" data-act="lwSel" data-id="${i}" aria-pressed="${L.lwSel===i}"><span>${av(i,18)} ${esc(P(i).name)}</span><span>${got[i]?"✓":lock[i]?"✕":""}</span></button>`}).join("");
 let q=`<p class="muted small">${t("Tap a name, then ask that person their question in person.")}</p>`;
 if(L.lwSel&&D.players[L.lwSel]){const i=L.lwSel,p=P(i),f=FQ[p.fq]||FQ[0],opts=L.lang==="es"?f.es.o:f.o;
  if(got[i])q=`<p>${t("{name}'s word is {w}. You earned the tile {l}.",{name:`<b>${esc(p.name)}</b>`,w:`<b>${p.word}</b>`,l:`<b>${p.word[0]}</b>`})}</p>`;
  else if(lock[i])q=`<p>${t("{name}'s word is locked. You get one try per person.",{name:`<b>${esc(p.name)}</b>`})}</p>`;
  else q=`<div class="eyebrow">${t("Ask {name}",{name:esc(p.name)})}</div><p class="qtext">${esc(L.lang==="es"?f.es.q:f.q)}</p><div class="opts">${opts.map((o,k)=>`<button data-act="lwAns" data-k="${k}" ${over?"disabled":""}>${esc(o)}</button>`).join("")}</div>`}
 const sub=lw.word?`<p class="pill ok">${t("You played {w} for {p} points",{w:lw.word,p:lw.pts})}</p>`:
  `<div class="row"><input type="text" id="lwWord" class="grow" placeholder="${t("Spell a word with your tiles")}" autocomplete="off" autocapitalize="characters"><button class="btn primary" data-act="lwSubmit">${t("Play word")}</button></div><div class="tiles preview" id="lwPrev"></div><p class="small muted m0">${t("Each tile can be used once. One point per letter. You get one play.")}</p>`;
 return `<div class="row between"><span class="muted small">${t("Your secret word:")} <b>${P(L.me).word}</b> · ${t("{n} tiles",{n:myTiles().length})}</span>${timer}</div>
 <div class="lw"><div class="col"><h3>${t("Your tiles")}</h3><div class="tiles">${tiles}</div></div><div class="col"><h3>${t("Who you're talking to")}</h3><div class="names">${names||`<span class="small muted">${t("Waiting for guests to join")}</span>`}</div></div><div class="col q"><h3>${t("Their question")}</h3>${q}</div></div>
 <section class="card stack">${sub}</section>`}

/* Trivia */
function gTrivia(){
 const list=TRV(),qi=Math.min(st().tvQ||0,list.length-1),it=list[qi];if(!it)return `<div class="card muted">${t("Starting soon")}</div>`;
 const opts=trivO(it),ans=it.a,pk=podOf(L.me);
 if(!pk)return `<div class="card muted">${t("You joined after pods were set. Ask the moderator to reset the pods, or cheer on this round.")}</div>`;
 const votes=D.tv[qi]||{},res=(votes._res||{})[pk],phase=st().tvPhase||"vote",tie=st().tvTie||{};
 const inRevote=phase==="revote"&&tie[pk];
 const myVote=inRevote?((D.tvr||{})[qi]||{})[L.me]:votes[L.me];
 const locked=res||(phase!=="vote"&&!inRevote);
 const ch=opts.map((o,k)=>`<button class="choice ${res&&k===ans?"right":""}" data-act="tvVote" data-k="${k}" aria-pressed="${myVote===k}" ${locked?"disabled":""}><span><b class="gnum il">${"ABCD"[k]}</b> ${esc(o)}</span></button>`).join("");
 let msg=`<p class="small muted m0">${t("Your pod: {names}. Talk it over. The majority picks your pod's answer. No speed bonus.",{names:podMembers(pk).map(i=>esc(P(i).name)).join(", ")})}</p>`;
 if(inRevote)msg=`<div class="banner"><span>${t("Your pod tied. Talk it over and vote again.")}</span><span class="num" data-timer="${st().tvRevoteEnd}">${fmtLeft(st().tvRevoteEnd)}</span></div>`;
 if(res){msg=`<div class="card soft">${res.tie?`<b>${t("Your pod stayed tied. No points this question.")}</b>`:res.correct?`<b>${t("Your pod picked \"{a}\". Correct!",{a:esc(opts[res.pick])})}</b> ${t("Everyone in your pod gets {p} points.",{p:pv("trivia")})}`:`<b>${t("Your pod picked \"{a}\".",{a:esc(opts[res.pick])})}</b> ${t("The answer was \"{a}\".",{a:esc(opts[ans])})}`}</div>`;
  const rk=qi+"|"+pk;if(!L.seenRes[rk]){L.seenRes[rk]=1;if(res.correct){setTimeout(()=>{confetti(90);SND.ding();buzz([50,30,100])},50)}}}
 else if(myVote!=null&&!inRevote)msg+=`<p class="pill ok as">${t("Vote in. Waiting for the moderator to close voting.")}</p>`;
 return `<section class="card stack"><div class="row between"><span class="eyebrow">${t("Question {i} of {n}",{i:qi+1,n:list.length})}</span><span class="pill ${teamOf(L.me).toLowerCase()}">${t("Pod {p}",{p:pk})}</span></div><h2 class="qh">${esc(trivQ(it))}</h2>${it.hard?`<span class="pill no as">${t("Hard one")}</span>`:""}<div class="choices">${ch}</div>${msg}</section>`}

/* Crossword */
const foot=(x,y,r,f)=>`<g transform="translate(${x} ${y}) rotate(${r})" fill="${f}"><ellipse cx="0" cy="0" rx="9" ry="15"/><ellipse cx="1" cy="-6" rx="7" ry="7"/><circle cx="-6" cy="-19" r="3.2"/><circle cx="-1.5" cy="-21" r="2.7"/><circle cx="2.5" cy="-20.5" r="2.4"/><circle cx="6" cy="-18.5" r="2.1"/><circle cx="8.5" cy="-15.5" r="1.8"/></g>`;
const hand=(x,y,r,f)=>`<g transform="translate(${x} ${y}) rotate(${r})" fill="${f}"><rect x="-11" y="-6" width="22" height="22" rx="10"/><rect x="-10" y="-24" width="5" height="20" rx="2.5"/><rect x="-4.5" y="-28" width="5" height="24" rx="2.5"/><rect x="1" y="-26" width="5" height="22" rx="2.5"/><rect x="6.5" y="-20" width="4.5" height="17" rx="2.2"/><rect x="-21" y="0" width="5" height="15" rx="2.5" transform="rotate(-40 -18 7)"/></g>`;
const rose=(x,y,s)=>{let p=`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 30 C-6 60 -2 90 0 120" stroke="var(--leaf)" stroke-width="5" fill="none"/><path d="M0 70 C-30 55 -45 70 -50 80 C-30 88 -12 82 0 70Z" fill="var(--leaf)"/><path d="M0 92 C28 78 44 90 48 100 C28 108 12 102 0 92Z" fill="var(--leaf)"/>`;
 [0,72,144,216,288].forEach(a=>p+=`<ellipse cx="0" cy="-21" rx="23" ry="29" fill="var(--rose)" transform="rotate(${a})"/>`);
 [36,108,180,252,324].forEach(a=>p+=`<ellipse cx="0" cy="-12.6" rx="15.4" ry="18.2" fill="var(--violet)" transform="rotate(${a})"/>`);
 return p+`<path d="M-12 0 C-12 -14 12 -14 12 0 C12 10 -6 12 -6 2 C-6 -4 4 -4 3 1" stroke="var(--rose)" stroke-width="3" fill="none"/></g>`};
const WM=`<svg class="wm" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${foot(48,70,-18,"var(--violet)")}${foot(78,40,-8,"var(--violet)")}${foot(330,330,160,"var(--leaf)")}${foot(360,300,170,"var(--leaf)")}${foot(60,350,20,"var(--flame)")}${hand(340,70,15,"var(--rose)")}${hand(300,55,-10,"var(--flame)")}${hand(150,360,-5,"var(--violet)")}${rose(200,190,1.15)}</svg>`;
function gCross(){
 const G=CWG(),solved=D.mine.cw||{};let cells="";
 const act=L.cwAct!=null?G.placed[L.cwAct]:null,actCells=new Set(act?cellsOf(act):[]);
 const done=new Set();G.placed.forEach(p=>{if(solved[p.id])cellsOf(p).forEach(k=>done.add(k))});
 for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=r+","+c;
  if(!G.sol[k]){cells+=`<div class="cell blk"></div>`;continue}
  const v=done.has(k)?G.sol[k]:(L.cwEntry[k]||"");
  cells+=`<div class="cell">${G.starts[k]?`<span class="n">${G.starts[k]}</span>`:""}<input maxlength="1" data-cell="${k}" value="${v}" class="${done.has(k)?"done":actCells.has(k)?"hl":""}" ${done.has(k)?"readonly":""} autocomplete="off" autocapitalize="characters" aria-label="Row ${r+1} column ${c+1}"></div>`}
 const list=d=>G.placed.map((p,k)=>({p,k})).filter(o=>o.p.d===d).sort((a,b)=>a.p.num-b.p.num).map(({p,k})=>`<li data-clue="${k}" class="${solved[p.id]?"done":""} ${L.cwAct===k?"act":""}"><b>${p.num}.</b> ${esc(cwClue(p))} (${p.w.length})</li>`).join("");
 const n=G.placed.filter(p=>solved[p.id]).length,partners=L.cwPartners.filter(i=>D.players[i]);
 return `<div class="row between"><span class="muted small">${t("{n} of {m} words · {p} pt each",{n,m:G.placed.length,p:pv("crossword")})}</span>${L.lang==="es"?`<span class="small muted">${t("Answers are in English.")}</span>`:""}</div>
 <section class="card stack tight"><span class="small"><b>${t("Sharing this screen?")}</b> ${t("Add who's solving with you. Everyone here gets full points.")}</span>
 <div class="row">${partners.map(i=>`<span class="pill ok">${esc(P(i).name)} <button class="btn xs" data-act="cwDrop" data-id="${i}" aria-label="Remove">×</button></span>`).join("")}<select id="cwAdd" data-act="cwAdd"><option value="">${t("Add a partner…")}</option>${ids().filter(i=>i!==L.me&&!partners.includes(i)).map(i=>`<option value="${i}">${esc(P(i).name)}</option>`).join("")}</select></div></section>
 <section class="cwbox">${WM}<div class="cw" style="grid-template-columns:repeat(${G.C},minmax(0,1fr))">${cells}</div></section>
 <section class="card clues"><div><h3>${t("Across")}</h3><ol>${list("A")}</ol></div><div><h3>${t("Down")}</h3><ol>${list("D")}</ol></div></section>`}

/* Superlatives */
function gSup(){
 const list=SUPS(),qi=Math.min(st().supQ||0,list.length-1),it=list[qi];if(!it)return "";
 const votes=D.sup[qi]||{},res=votes._res,pair=st().supPair||[],my=votes[L.me],opts=SUPOPT();
 const upFront=pair.filter(i=>D.players[i]).map(i=>esc(P(i).name)).join(" &amp; ")||t("to be picked");
 const ch=opts.map((o,k)=>`<button class="choice" data-act="supVote" data-k="${k}" aria-pressed="${my===k}" ${res?"disabled":""}><span>${esc(o)}</span></button>`).join("");
 let out=`<section class="card stack"><div class="row between"><span class="eyebrow">${t("Question {i} of {n}",{i:qi+1,n:list.length})}</span><span class="small muted">${t("Up front: {names}",{names:upFront})}</span></div><h2 class="qh">${esc(supLine(it))}</h2><div class="choices">${ch}</div>
 <p class="small muted m0">${pair.includes(L.me)?t("You're up front! Vote without looking at your partner."):t("You're voting with {team}.",{team:esc(teamName(teamOf(L.me)))})} ${t("If the pair agrees, they each score. If not, the team that agrees more strongly takes the round.")}</p>${my!=null&&!res?`<p class="pill ok as">${t("Vote in")}</p>`:""}</section>`;
 if(res)out+=supResult(res);return out}
function supResult(r){const opts=SUPOPT();const row=(tm,pct,top)=>`<div class="stack tight"><div class="row between small"><span class="pill ${tm.toLowerCase()}">${esc(teamName(tm))}</span><span class="num">${t("{pct}% picked {name}",{pct,name:esc(opts[top]||"")})}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
 return `<section class="card stack"><h3>${t("Results")}</h3>${r.pa!=null?`<p class="small m0">${esc(r.na)} → <b>${esc(opts[r.pa]||"")}</b> · ${esc(r.nb)} → <b>${r.pb!=null?esc(opts[r.pb]||""):"—"}</b></p>`:""}${row("A",r.pctA,r.topA)}${row("B",r.pctB,r.topB)}<p class="m0"><b>${esc(r.msg)}</b></p></section>`}

/* Bingo */
function gBingo(){
 const round=st().bingoRound||1,called=st().called||[],card=cardFor(L.me,round),mk=L.marks[round]||[];
 const last=called[called.length-1],claim=((D.claims||{})[round]||{})[L.me];
 let grid='<div class="bingo">'+"BINGO".split("").map(l=>`<div class="h">${l}</div>`).join("");

/* ---- Content: lists, answer key, editor, AI helper ---- */
const KINDS={trivia:"Trivia",hunt:"Scavenger Hunt",cw:"Crossword",sups:"Superlatives",tie:"Tiebreaker"};
function cleanLine(s){return s.replace(/^\s*(?:\d+[.)]|[-*•])\s*/,"").trim()}
function toText(kind){const c=C();
 if(kind==="trivia")return TRV().map(x=>`${x.q} | ${x.o.join(" | ")} | ${"ABCD"[x.a]||"A"}${x.hard?" | hard":""}`+(x.es&&x.es.q?`\nes: ${x.es.q} | ${arr(x.es.o).join(" | ")}`:"")).join("\n");
 if(kind==="hunt")return HUNTS().map(x=>`${x.n} | ${x.h}`+(x.es&&x.es.n?`\nes: ${x.es.n} | ${x.es.h||""}`:"")).join("\n");
 if(kind==="cw")return CWW().map(x=>`${x.w} | ${x.c}`+(x.es?`\nes: ${x.es}`:"")).join("\n");
 if(kind==="sups")return SUPS().map(x=>x.q+(x.es?`\nes: ${x.es}`:"")).join("\n");
 if(kind==="tie"){const x=c.tie||{};return `${x.q||""} | ${x.a==null?"":x.a}`+(x.es?`\nes: ${x.es}`:"")}}
function parseKind(kind,text){const out=[],errs=[];const lines=String(text||"").split(/\r?\n/);
 lines.forEach((raw,n)=>{const line=cleanLine(raw);if(!line||/^```/.test(line))return;
  const isEs=/^es\s*:/i.test(line);const body=line.replace(/^es\s*:\s*/i,"");const parts=body.split("|").map(s=>s.trim());
  if(isEs){const last=out[out.length-1];if(!last){errs.push(n+1);return}
   if(kind==="trivia"){if(parts.length>=5)last.es={q:parts[0],o:parts.slice(1,5)};else errs.push(n+1)}
   else if(kind==="hunt")last.es={n:parts[0],h:parts[1]||""};
   else last.es=body.trim();return}
  if(kind==="trivia"){if(parts.length<6){errs.push(n+1);return}const a="ABCD".indexOf(parts[5].toUpperCase().replace(/[^A-D]/g,"")[0]);if(a<0){errs.push(n+1);return}
   out.push({q:parts[0],o:parts.slice(1,5),a,hard:/hard/i.test(parts.slice(6).join(" "))||undefined})}
  else if(kind==="hunt"){if(parts.length<2||!parts[0]){errs.push(n+1);return}out.push({n:parts[0],h:parts[1]})}
  else if(kind==="cw"){const w=(parts[0]||"").toUpperCase().replace(/[^A-Z]/g,"");if(w.length<2||!parts[1]){errs.push(n+1);return}out.push({w,c:parts[1]})}
  else if(kind==="sups"){let q=body.replace(/^who('s| is)? (most )?likely to\s*/i,"").trim();if(!q){errs.push(n+1);return}if(!/[?]$/.test(q))q+="?";out.push({q:q.charAt(0).toUpperCase()+q.slice(1)})}
  else if(kind==="tie"){const a=parseFloat((parts[1]||"").replace(/[^0-9.\-]/g,""));if(!parts[0]||isNaN(a)){errs.push(n+1);return}out.push({q:parts[0],a})}});
 out.forEach(o=>{Object.keys(o).forEach(k=>o[k]===undefined&&delete o[k])});return {items:out,errs}}
function promptFor(kind){const c=C();const n=+dv("aiN_"+kind,{trivia:10,hunt:8,cw:12,sups:8,tie:1}[kind]);const es=dv("aiEs_"+kind,"1")==="1";
 const theme=((c.themeDesc||c.title||"a party")+(c.honorees?` honoring ${c.honorees}`:"")).replace(/[.\s]+$/,"");
 const head=`I'm hosting ${theme}. I'm running party games on guests' phones.`;
 const fmt="Reply with only the list, one item per line, in exactly this format, with no numbering, headings or extra text:";
 if(kind==="trivia")return `${head} Write ${n} multiple-choice trivia questions that fit this theme. Make most of them fun and easy, and about ${Math.max(1,Math.round(n*.3))} hard ones that most guests will have to guess. Each question has exactly 4 answer choices written in the same style (for example, all exact numbers or all short phrases), with only one correct answer.\n\n${fmt}\nQuestion | choice A | choice B | choice C | choice D | letter of the correct choice\nAdd " | hard" to the end of each hard question's line.${es?`\nRight after each question line, add a Spanish translation line in this format:\nes: pregunta | opción A | opción B | opción C | opción D`:""}\n\nExample:\nHow many bones is a newborn born with? | 100 | 206 | 300 | 500 | C${es?"\nes: ¿Con cuántos huesos nace un recién nacido? | 100 | 206 | 300 | 500":""}`;
 if(kind==="hunt")return `${head} Suggest ${n} scavenger hunt items the host can hide around the venue. They should fit the theme, be small, easy to buy or find, and easy to photograph. For each item, write a short playful hint that describes it without naming it.\n\n${fmt}\nItem name | hint${es?`\nRight after each line, add a Spanish line in this format:\nes: nombre | pista`:""}\n\nExample:\nRubber duck | I float through every bath time.${es?"\nes: Patito de goma | Floto en cada hora del baño.":""}`;
 if(kind==="cw")return `${head} Suggest ${n} English words for a crossword that fit this theme. Each word must be a single word with letters only (no spaces or hyphens), 3 to 9 letters long. Choose words that share common letters so they interlock well. For each word, write a short, friendly clue.\n\n${fmt}\nWORD | clue${es?`\nRight after each line, add the clue in Spanish (the answer stays in English) in this format:\nes: pista`:""}\n\nExample:\nCRADLE | A bed that rocks${es?"\nes: Una cama que se mece":""}`;
 if(kind==="sups")return `${head} Guests vote on "Who is most likely to…" questions, choosing between ${SUPOPT().join(" and ")}. Write ${n} fun, kind questions that fit this theme. Write only the ending of each question, starting with a verb and ending with a question mark.\n\n${fmt}\nending of the question?${es?`\nRight after each line, add the Spanish ending in this format (it follows "¿Quién tiene más probabilidades de"):\nes: final de la pregunta?`:""}\n\nExample:\nCry the hardest when the baby is born?${es?"\nes: llorar más fuerte cuando nazca el bebé?":""}`;
 if(kind==="tie")return `${head} Write one tiebreaker question for the end of the night that has a single number as its answer, so the team whose guess is closest wins. It should fit the theme and be hard to know exactly.\n\n${fmt}\nQuestion | number${es?`\nThen add a Spanish line:\nes: pregunta`:""}\n\nExample:\nHow many diapers does a baby use in its first year? | 2500${es?"\nes: ¿Cuántos pañales usa un bebé en su primer año?":""}`}
function keyView(kind){
 if(kind==="trivia")return `<ol class="keylist">${TRV().map(x=>`<li><b>${esc(x.q)}</b>${x.hard?' <span class="pill no">Hard</span>':""}<div class="key">${x.o.map((o,k)=>`<span class="${k===x.a?"right":""}"><b>${"ABCD"[k]}</b> ${esc(o)}${k===x.a?" ✓":""}</span>`).join("")}</div>${x.es&&x.es.q?`<div class="small muted">ES: ${esc(x.es.q)}</div>`:""}</li>`).join("")}</ol>`;
 if(kind==="hunt")return `<ol class="keylist">${HUNTS().map(x=>`<li><b>${esc(x.n)}</b> <span class="muted">· ${esc(x.h)}</span></li>`).join("")}</ol>`;
 if(kind==="cw"){const G=CWG();return `<p class="small m0">${G.placed.length} of ${CWW().length} words fit in the puzzle.${G.unplaced.length?` <span class="bad">Not used: ${esc(G.unplaced.join(", "))}. Try words that share more letters.</span>`:""}</p><ol class="keylist">${CWW().map(x=>`<li><b>${esc(x.w)}</b> <span class="muted">· ${esc(x.c)}</span></li>`).join("")}</ol>`}
 if(kind==="sups")return `<p class="small m0">Answer choices: <b>${esc(SUPOPT().join(" · "))}</b> (change them in Event)</p><ol class="keylist">${SUPS().map(x=>`<li>Who is most likely to ${esc(supQ(x))}</li>`).join("")}</ol>`;
 if(kind==="tie"){const x=C().tie||{};return `<p class="m0"><b>${esc(x.q||"")}</b> <span class="pill ok">Answer: ${esc(x.a)}</span></p>`}}
function mContent(){

function formatHelp(k){return {trivia:"One question per line: Question | A | B | C | D | correct letter. Add | hard for hard ones. Optional Spanish line below it: es: pregunta | a | b | c | d",

 sups:"One question ending per line, for example: Spoil the baby rotten? Optional Spanish line below it: es: consentir demasiado al bebé?",tie:"Question | number answer. Optional Spanish line below it: es: pregunta"}[k]}

/* balanced secret words: keep about 4 in 10 first letters as vowels */
function pickWord(){const firsts=ids().map(i=>P(i).word[0]);const vow=firsts.filter(l=>VOWELS.includes(l)).length;
 const pool=(firsts.length===0||vow/firsts.length<.38?VOWELS:CONS_ORDER).split("");
 const cnt=l=>firsts.filter(x=>x===l).length,min=Math.min(...pool.map(cnt)),ls=pool.filter(l=>cnt(l)===min);const l=ls[rnd(ls.length)];const ws=WORDBANK[l];return ws[rnd(ws.length)]}

/* trivia: majority per pod; tied pods get 15 seconds to revote; still tied means no points */
function resolveTrivia(finish){
 const list=TRV(),qi=st().tvQ||0,it=list[qi];if(!it)return;const opts=it.o,ans=it.a,pods=st().pods||{},votes=D.tv[qi]||{},rev=(D.tvr||{})[qi]||{},tie=st().tvTie||{};
 const keys=[...new Set(Object.values(pods))];const results={},newTie={};
 keys.forEach(pk=>{if((votes._res||{})[pk])return;if(finish&&!tie[pk])return;const mem=Object.keys(pods).filter(i=>pods[i]===pk);const src=finish?rev:votes;
  const tl=opts.map(()=>0);mem.forEach(i=>{if(src[i]!=null)tl[src[i]]++});const max=Math.max(...tl);
  if(max===0){results[pk]={tie:true,none:true};return}
  const tops=tl.map((n,k)=>n===max?k:-1).filter(k=>k>=0);
  if(tops.length>1){if(finish)results[pk]={tie:true};else newTie[pk]=true;return}
  const pick=tops[0],correct=pick===ans;results[pk]={pick,correct};
  const live=mem.filter(i=>D.players[i]);if(correct)award(live,pv("trivia"),pk[0],pv("trivia"));
  live.forEach(pid=>ER("streak/"+pid).transaction(v=>correct?(v||0)+1:0,(e,ok,snap)=>{if(ok&&snap&&snap.val()>=3)badge(pid,"streak3")}))});
 Object.keys(results).forEach(pk=>{if(results[pk].tie)Object.keys(pods).filter(i=>pods[i]===pk&&D.players[i]).forEach(pid=>ER("streak/"+pid).set(0))});
 const u={};Object.keys(results).forEach(pk=>u["tv/"+qi+"/_res/"+pk]=results[pk]);
 if(Object.keys(newTie).length){u["state/tvPhase"]="revote";u["state/tvTie"]=newTie;u["state/tvRevoteEnd"]=now()+15000}
 else{u["state/tvPhase"]="done";u["state/tvTie"]=null;const all=Object.assign({},votes._res||{},results);const right=Object.values(all).filter(r=>r.correct).length;
  if(right)u["state/celebrate"]={text:`${right} pod${right>1?"s":""} got it right!`,t:now()}}
 ER().update(u)}
let finishing=false;

 if(s.live==="trivia"&&s.tvPhase==="revote"&&s.tvRevoteEnd&&now()>s.tvRevoteEnd+1500&&!finishing){finishing=true;resolveTrivia(true);setTimeout(()=>finishing=false,4000)}

/* superlatives: pair agrees -> each of the pair scores; otherwise the team that agrees more strongly wins */
function resolveSup(){
 const qi=st().supQ||0,v=D.sup[qi]||{};if(v._res)return;const [a,b]=st().supPair||[];
 const pa=a?v[a]:null,pb=b?v[b]:null,pts=pv("sup"),opts=SUPOPT();
 const count=tm=>{const m=members(tm).filter(i=>i!==a&&i!==b&&v[i]!=null);const c=opts.map(()=>0);m.forEach(i=>c[v[i]]=(c[v[i]]||0)+1);const top=c.indexOf(Math.max(...c));return{top:top<0?0:top,pct:m.length?Math.round(100*c[top]/m.length):0}};
 const A=count("A"),B=count("B");let msg,win=null;
 if(pa!=null&&pa===pb){award([a,b],pts,null,0);msg=`The pair agreed on ${opts[pa]}. ${P(a).name} and ${P(b).name} each get ${pts} points.`}
 else if(A.pct===B.pct)msg=`The teams tied at ${A.pct}%. No point this round.`;
 else{win=A.pct>B.pct?"A":"B";award(members(win),pts,win,pts);msg=`${teamName(win)} agreed more strongly and takes the round. Each member gets ${pts} points.`}
 ER(`sup/${qi}/_res`).transaction(cur=>cur?undefined:{pa:pa==null?null:pa,pb:pb==null?null:pb,na:a?P(a).name:"",nb:b?P(b).name:"",topA:A.top,pctA:A.pct,topB:B.top,pctB:B.pct,msg},(e,ok)=>{if(ok&&win)setState({entrance:{team:win,label:"Wins the round",t:now()}})})}

 ["Can't wait to meet the little one!","You two are going to be amazing parents.","Wishing you sweet dreams and lots of giggles."].forEach((tx,i)=>u[`events/${code}/wishes/w${i}`]={pid:"bot0"+i,name:BOT_NAMES[i],text:tx,t:Date.now()+i});

function botTick(){if(!D.meta||!D.meta.practice)return;const s=st(),bots=ids().filter(i=>P(i).bot);if(!bots.length)return;
 if(s.countdown&&now()<s.countdown.at)return;
 if(s.live==="trivia"){const list=TRV(),qi=s.tvQ||0,it=list[qi];if(it){if((s.tvPhase||"vote")==="vote"){const v=D.tv[qi]||{};bots.filter(b=>v[b]==null&&podOf(b)).forEach(b=>{if(Math.random()<.2)ER(`tv/${qi}/${b}`).set(Math.random()<.62?it.a:rnd(4))})}
  else if(s.tvPhase==="revote"){const v=(D.tvr||{})[qi]||{},tie=s.tvTie||{};bots.filter(b=>v[b]==null&&tie[podOf(b)]).forEach(b=>{if(Math.random()<.3)ER(`tvr/${qi}/${b}`).set(Math.random()<.6?it.a:rnd(4))})}}}
 if(s.live==="sup"){const qi=s.supQ||0,v=D.sup[qi]||{};if(!v._res)bots.filter(b=>v[b]==null).forEach(b=>{if(Math.random()<.2)ER(`sup/${qi}/${b}`).set(Math.random()<.6?0:1)})}
 if(s.live==="split"&&Math.random()<.06){const b=bots[rnd(bots.length)],tm=teamOf(b),names=["The Night Owls","Rattle Rousers","Garden Gnomes","Lullaby Legends","Snack Pack","Bottle Rockets"];ER("sugg/"+tm).push({name:names[rnd(names.length)],by:b,v:{[b]:true}})}
 const items=HUNTS();if(items.length&&Math.random()<.05){const b=bots[rnd(bots.length)],k=rnd(items.length),h=(D.huntAll||{})[b]||{};if(h[k]!=="ok"){ER(`hunt/${b}/${k}`).set("ok");ER(`photos/${b}_${k}`).set({who:b,k,img:null,t:Date.now(),checked:false});award([b],pv("hunt"),teamOf(b),pv("hunt"))}}
 if(s.live==="bingo"){const round=s.bingoRound||1,called=s.called||[],cl=(D.claims||{})[round]||{};bots.forEach(b=>{if(!cl[b]&&hasBingo(cardFor(b,round),n=>called.includes(n)))ER(`claims/${round}/${b}`).set({t:Date.now(),ok:false})})}
 if(s.live==="longword"&&s.lwEnd&&now()>s.lwEnd)bots.forEach(b=>{const lw=(D.lwAll||{})[b]||{};if(!lw.word&&Math.random()<.3){const w=["TEA","NEST","PETAL","GARDEN","LANTERN","BLOSSOM"][rnd(6)],p=w.length*pv("longword");ER(`lw/${b}`).update({word:w,pts:p});award([b],p,teamOf(b),p)}});
 if(Math.random()<.04)ER("reactions").push({e:REACTIONS[rnd(REACTIONS.length)],t:SERVER_TS()})}
