<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8338f">
<title>Host Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Light garden look: blush ground with the invitation's magenta, orange, gold, blue and green as accents.
   Layout: one column "phone" for guests, wide two-pane console for the moderator, a full TV board for the big screen.
   */
:root{
  color-scheme:light;
  --ground:#f8f2fb; --ground-2:#efe4f7; --card:#ffffff; --line:#dcc6ea;
  --ink:#33163f; --muted:#7a5d86; --violet:#7b3fb8; --mint:#e3f3e6;
  --rose:#e8338f; --flame:#f6892f; --gold:#e0a826; --leaf:#2f8a4c; --sky:#3f74d6;
  --bad:#e0475b;
  --f-script:"Great Vibes","Brush Script MT",cursive;
  --f-caps:"Marcellus","Trajan Pro",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(900px 420px at 50% -160px,color-mix(in srgb,var(--rose) 24%,transparent),transparent 70%),
  radial-gradient(650px 520px at -10% 35%,color-mix(in srgb,var(--violet) 22%,transparent),transparent 70%),
  radial-gradient(700px 520px at 110% 70%,color-mix(in srgb,var(--flame) 18%,transparent),transparent 70%),
  radial-gradient(900px 560px at 40% 115%,color-mix(in srgb,var(--leaf) 30%,transparent),transparent 70%),
  radial-gradient(500px 400px at 100% 0%,color-mix(in srgb,var(--leaf) 16%,transparent),transparent 70%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand h1{font-family:var(--f-script);font-weight:400;font-size:2.5rem;line-height:1;margin:0;
  background:linear-gradient(90deg,var(--rose),var(--flame) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;font-family:var(--f-caps);letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--leaf)}
.seg{display:inline-flex;background:var(--ground-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--rose);color:#fff}
h2{color:var(--violet);font-family:var(--f-caps);font-weight:400;letter-spacing:.06em;font-size:1.3rem;margin:0;text-wrap:balance}
h3{color:var(--leaf);font-family:var(--f-caps);font-weight:400;letter-spacing:.05em;font-size:1.02rem;margin:0}
.eyebrow{font-family:var(--f-caps);text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;color:#b5800f}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--mint) 35%,var(--card)));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 2px 12px color-mix(in srgb,var(--violet) 10%,transparent)}
.btn{border:1px solid var(--line);background:var(--ground-2);padding:9px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(135deg,var(--rose),var(--flame));border-color:transparent;color:#fff}
.btn.gold{background:var(--gold);color:#2a1530;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.02em}
.pill.a{background:color-mix(in srgb,var(--sky) 16%,transparent);color:#244a96}
.pill.b{background:color-mix(in srgb,var(--flame) 18%,transparent);color:#9a4a0a}
.pill.live{background:var(--rose);color:#fff}
.pill.ok{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:#1e6236}
.pill.warn{background:color-mix(in srgb,var(--gold) 24%,transparent);color:#7a5600}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:#9b1c1c}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=url],select{background:var(--ground-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input[type=number]{width:70px}
.num{font-variant-numeric:tabular-nums}
/* phone column */
.phone{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tabs{position:sticky;bottom:0;box-shadow:0 -4px 18px color-mix(in srgb,var(--rose) 12%,transparent);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:color-mix(in srgb,#fff 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{border:0;background:none;border-radius:11px;padding:7px 2px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-pressed="true"]{background:var(--ground-2);color:var(--violet)}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.score{font-family:var(--f-caps);font-size:2.4rem;line-height:1;color:var(--rose)}
.livebtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:16px;border-radius:var(--r);border:0;
  background:linear-gradient(135deg,var(--rose),var(--flame));color:#fff}
.livebtn strong{font-family:var(--f-caps);font-weight:400;font-size:1.25rem;letter-spacing:.04em}
.banner{background:var(--gold);color:#2a1530;border-radius:12px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
/* moderator */
.console{display:grid;grid-template-columns:220px 1fr;gap:16px}
.side{display:flex;flex-direction:column;gap:4px}
.side button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.side button[aria-pressed="true"]{background:var(--card);color:var(--violet);box-shadow:inset 3px 0 0 var(--leaf)}
@media (max-width:720px){.console{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side button{white-space:nowrap}.side button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--gold)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.gamelist{display:grid;gap:8px}
.gamerow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ground-2);border:1px solid var(--line)}
.gamerow.on{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.gnum{font-family:var(--f-caps);color:var(--rose);font-size:1.1rem;width:24px;text-align:center}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-caps);font-weight:400;letter-spacing:.08em;font-size:.72rem;text-transform:uppercase;color:var(--leaf)}
.tscroll{overflow-x:auto}
/* team score bar */
.tbar{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tbar>div{padding:10px 12px}
.tbar .ta{background:color-mix(in srgb,var(--sky) 16%,var(--card))}
.tbar .tb{background:color-mix(in srgb,var(--flame) 18%,var(--card));text-align:right}
.tbar b{font-family:var(--f-caps);font-weight:400;font-size:1.6rem;display:block;line-height:1.1}
/* long word */
.lw{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;min-height:300px}
.lw .col{background:color-mix(in srgb,var(--mint) 60%,var(--card));border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.tiles{display:flex;flex-wrap:wrap;gap:5px}
.tile{width:34px;height:38px;border-radius:6px;background:linear-gradient(#fbe7b3,#e9c46a);color:#3a2408;font-family:var(--f-caps);font-size:1.25rem;display:grid;place-items:center;box-shadow:0 2px 0 #9b7a2b;position:relative}
.tile small{position:absolute;right:3px;bottom:1px;font-size:.5rem;font-family:var(--f-body)}
.tile.new{animation:flip .9s cubic-bezier(.2,.8,.3,1.2)}
@keyframes flip{0%{transform:translateY(-30px) rotateY(180deg) scale(1.6);opacity:0}60%{transform:translateY(4px) rotateY(0) scale(1.1);opacity:1}100%{transform:none}}
.names{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:330px}
.names button{text-align:left;border:1px solid transparent;background:var(--card);border-radius:8px;padding:7px 8px;font-size:.82rem;display:flex;justify-content:space-between;gap:4px}
.names button[aria-pressed="true"]{border-color:var(--gold)}
.names button.got{color:var(--leaf)}
.names button.lock{color:var(--muted);text-decoration:line-through}
.opts{display:grid;gap:6px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px;text-align:left;font-weight:600}
.opts button:hover{border-color:var(--gold)}
@media (max-width:520px){.lw{grid-template-columns:1fr 1fr}.lw .col.q{grid-column:1/-1}}
/* crossword */
.cwbox{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);padding:14px;isolation:isolate;
  background:linear-gradient(135deg,color-mix(in srgb,var(--rose) 14%,var(--card)),color-mix(in srgb,var(--violet) 12%,var(--card)) 45%,color-mix(in srgb,var(--leaf) 14%,var(--card)) 80%,color-mix(in srgb,var(--flame) 12%,var(--card)))}
.cwbox .wm{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.16;pointer-events:none}
.cw{display:grid;gap:2px;width:100%;max-width:440px;margin:0 auto;position:relative}
.cell{aspect-ratio:1;position:relative;min-width:0}
.cell input{min-width:0;box-shadow:0 1px 2px color-mix(in srgb,var(--violet) 25%,transparent)}
.cell.blk{background:transparent}
.cell input{width:100%;height:100%;border:1px solid var(--line);border-radius:3px;background:#fff;color:#2a1530;text-align:center;font-weight:700;font-size:clamp(.6rem,3.2vw,1rem);text-transform:uppercase;padding:0}
.cell input.hl{background:#ffe9b8}
.cell input.done{background:#bfe8c9}
.cell .n{position:absolute;top:0;left:2px;font-size:.45rem;color:#6b3d63;pointer-events:none;font-weight:700}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clues ol{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
.clues li{font-size:.82rem;cursor:pointer;padding:3px 5px;border-radius:6px}
.clues li.done{color:var(--leaf);text-decoration:line-through}
.clues li.act{background:var(--mint)}
@media (max-width:420px){.clues{grid-template-columns:1fr}}
/* bingo */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bingo .h{font-family:var(--f-caps);text-align:center;font-size:1.4rem;color:var(--rose)}
.bingo button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--ground-2);font-size:1.15rem;font-weight:700}
.bingo button.m{background:var(--violet);border-color:var(--violet);color:#fff}
.bingo button.free{background:var(--leaf);border-color:var(--leaf);font-size:.7rem;color:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.called{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.called span{font-size:.62rem;text-align:center;padding:3px 0;border-radius:4px;background:var(--ground-2);color:var(--muted)}
.called span.on{background:var(--gold);color:#2a1530;font-weight:700}
.ball{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7df,var(--gold) 60%,#b88a2a);color:#2a1530;display:grid;place-items:center;font-family:var(--f-caps);font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.4)}
/* trivia / superlatives */
.choices{display:grid;gap:8px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--ground-2);padding:12px 14px;border-radius:12px;text-align:left;font-weight:600}
.choice[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.choice.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 25%,var(--ground-2))}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.votes{display:flex;gap:3px}
.votes i{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
/* hunt */
.hunt{display:grid;gap:8px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:color-mix(in srgb,var(--mint) 55%,var(--card));border:1px solid var(--line);border-radius:12px;padding:8px}
.thumb{width:52px;height:52px;border-radius:8px;background:var(--card);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--f-caps);font-size:1.2rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* big screen */
.tv{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:760px){.tv{grid-template-columns:1fr}}
.tv .stage{min-height:360px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--flame) 12%,var(--ground-2)) 70%,color-mix(in srgb,var(--leaf) 14%,var(--ground-2)));border:1px solid var(--line);border-radius:20px;padding:24px}
.tv .stage h2{font-size:2rem}
.huge{font-family:var(--f-caps);font-size:clamp(3rem,10vw,6rem);line-height:1;color:var(--rose)}
.winner{font-family:var(--f-script);font-size:clamp(3rem,9vw,5.5rem);line-height:1;background:linear-gradient(90deg,var(--rose),var(--flame),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.swatches input[type=color]{width:46px;height:46px;border:2px solid var(--line);border-radius:10px;background:none;padding:2px}
.invite{width:100%;max-width:150px;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.demo{font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:4px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2 additions ===== */
:root{--hc-ink:#000}
html.large .wrap{zoom:1.16}
html.hc{--ground:#ffffff;--ground-2:#f1ebf5;--card:#ffffff;--line:#4a2d57;--ink:#000000;--muted:#2c1a35;--mint:#ffffff}
html.hc body{background-image:none}
html.hc .card{background:#fff;box-shadow:none;border-width:2px}
html.hc .pill{outline:1px solid currentColor}
html.hc .muted{color:#2c1a35}
.m0{margin:0}.mt4{margin-top:4px}.mt6{margin-top:6px}.mb12{margin-bottom:12px}.tc{text-align:center}.tl{text-align:left}.tr{text-align:right}.nw{white-space:nowrap}
.db{display:block}.w100{width:100%}.w110{width:110px}.grow{flex:1;min-width:0}.mw0{min-width:0}.mw200{min-width:200px}.as{align-self:flex-start}.asc{align-self:center}.jc{justify-content:center}.top{align-items:flex-start}
.g8{gap:8px}.g16{gap:16px}.tight{gap:4px}.il{display:inline}.brk{word-break:break-all}.bad{color:var(--bad)}
.narrow{max-width:420px;margin:0 auto}
.btn.xs{padding:2px 7px;font-size:.75rem;border-radius:7px}
.btn.big{font-size:1.15rem;padding:14px}
.banner.soft{background:var(--ground-2);color:var(--ink)}
.card.soft{background:var(--ground-2)}
.aa{font-family:var(--f-caps);font-size:1rem;min-width:44px}
header.top{position:relative}
textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0;resize:vertical}
textarea[readonly]{background:var(--ground-2);font-size:.85rem}
.qh{font-family:var(--f-body);font-weight:700;font-size:1.2rem;letter-spacing:0;color:var(--ink)}
.qtext{margin:2px 0 6px;font-weight:600}
.score.sm{font-size:1.6rem}
.winner.sm{font-size:2.6rem}
.hero{grid-template-columns:auto 1fr auto}
.hero-av{border:0;background:none;padding:0;border-radius:50%}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ground-2);overflow:hidden;font-size:16px;line-height:1;vertical-align:middle;flex:none;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.ev-art{width:100%;max-height:160px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line)}
.ev-art.big{max-height:200px;width:auto;max-width:100%;align-self:center}
.avpick{display:flex;flex-wrap:wrap;gap:6px}
.avpick button,.avsel{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer}
.avpick button[aria-pressed="true"],.avsel.on{border-color:var(--rose);box-shadow:0 0 0 2px color-mix(in srgb,var(--rose) 30%,transparent)}
.avsel img{width:100%;height:100%;object-fit:cover}
.avsel input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rxbar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rxbar button{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:1.5rem;padding:8px 0;transition:transform .15s}
.rxbar button:active{transform:scale(.9)}
.rxbar button.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.35)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.album img,.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.ph{border:0;padding:0;background:none;border-radius:10px;overflow:hidden}
.strip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.strip img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-caps);font-weight:400;font-size:1.8rem;color:var(--rose)}
.stats span{font-size:.8rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bd{background:var(--ground-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.bd span{font-size:1.8rem}.bd small{font-size:.72rem;color:var(--muted)}
.wish{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.key span{padding:6px 9px;border-radius:9px;background:var(--ground-2);font-size:.85rem}
.key span.right{background:color-mix(in srgb,var(--leaf) 20%,var(--card));color:#1e6236;font-weight:700;outline:1px solid var(--leaf)}
.keylist{margin:0;padding-left:22px;display:grid;gap:8px}
.keylist li{font-size:.9rem}
.steps{margin:0;padding-left:20px;display:grid;gap:14px}
.steps li{display:flex;flex-direction:column;gap:6px}
.steps input[type=number]{width:70px}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* ===== Tonight tab ===== */
.pill.gold{background:linear-gradient(135deg,#f3d36b,var(--gold));color:#3a2600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .pill{background:var(--ground-2);color:var(--ink);font-weight:600;padding:5px 6px 5px 11px}
.chips .pill.gold{background:linear-gradient(135deg,#f3d36b,var(--gold));color:#3a2600}
.pill .x{border:0;background:none;width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1;color:var(--muted);display:grid;place-items:center}
.pill .x:hover{background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--rose)}
.gnum.rostime{width:auto;min-width:62px;font-size:.82rem;font-family:var(--f-body);font-weight:700;color:var(--violet);white-space:nowrap}
.tv.one{grid-template-columns:1fr}
.rafstage{min-height:70vh}
.rafreel{font-family:var(--f-caps);font-size:clamp(2.6rem,8vw,5rem);line-height:1.1;color:var(--rose);min-height:1.2em}
.gilt-text{background:linear-gradient(100deg,#9c6b00,var(--gold) 30%,#f6dc83 50%,var(--gold) 70%,#9c6b00);-webkit-background-clip:text;background-clip:text;color:transparent}
details>summary{cursor:pointer;color:var(--violet)}

/* ===== Polish pass: vivid color, a few gold accents, calmer screens ===== */
/* gold hairline on the key card of a screen */
.gilt{border:1px solid color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 22%,transparent),0 8px 26px color-mix(in srgb,var(--rose) 12%,transparent)}
/* fine gold divider under the event title */
header.top .brand::after{content:"";display:block;width:88px;height:1px;margin-top:9px;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 0%,transparent))}
/* richer background on the guest side */
body:has(.phone){background-image:radial-gradient(900px 440px at 50% -170px,color-mix(in srgb,var(--rose) 38%,transparent),transparent 70%),
  radial-gradient(650px 520px at -12% 34%,color-mix(in srgb,var(--violet) 32%,transparent),transparent 70%),
  radial-gradient(700px 520px at 112% 68%,color-mix(in srgb,var(--flame) 30%,transparent),transparent 70%),
  radial-gradient(900px 560px at 40% 116%,color-mix(in srgb,var(--leaf) 38%,transparent),transparent 70%)}
/* guest cards: crisp white, with a touch of the theme color in the edge and shadow */
.phone .card{background:var(--card);border-color:color-mix(in srgb,var(--rose) 20%,var(--line));box-shadow:0 1px 2px color-mix(in srgb,var(--violet) 10%,transparent),0 10px 28px color-mix(in srgb,var(--rose) 13%,transparent)}
.phone>.card:not(.card~.card){border-color:color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 20%,transparent),0 12px 30px color-mix(in srgb,var(--rose) 16%,transparent)}
.phone .eyebrow{color:#a8740a}
/* bottom tabs: vivid active state with a gold underline */
.tabs button{transition:color .18s,background .18s}
.tabs button[aria-pressed="true"]{background:color-mix(in srgb,var(--rose) 13%,var(--card));color:var(--rose);box-shadow:inset 0 -2px 0 var(--gold)}
.side button[aria-pressed="true"]{color:var(--rose)}
/* buttons: fuller color, soft glow, a little press */
.btn{transition:transform .12s ease,box-shadow .18s ease,border-color .18s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{box-shadow:0 6px 16px color-mix(in srgb,var(--btn1,var(--rose)) 34%,transparent);text-shadow:0 1px 1px rgba(0,0,0,.12)}
.btn.gold{background:linear-gradient(135deg,#f3d36b,var(--gold) 55%,#c98f12);box-shadow:0 6px 16px color-mix(in srgb,var(--gold) 34%,transparent)}
.phone .btn{min-height:44px}
.phone .btn.sm{min-height:34px}
.pill.live{background:linear-gradient(135deg,var(--rose),var(--flame))}
.pill.a{background:color-mix(in srgb,var(--sky) 22%,transparent)}
.pill.b{background:color-mix(in srgb,var(--flame) 24%,transparent)}
/* winner moments in gold */
.winner{filter:drop-shadow(0 2px 10px color-mix(in srgb,var(--gold) 35%,transparent))}
/* calmer checklist: only the next step shows its explanation */
.cklist li:not(.next) .db{display:none}
.cklist li.next{border:1px solid color-mix(in srgb,var(--gold) 70%,transparent);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:active:not(:disabled){transform:none}}
/* ===== weak signal pill ===== */
#net{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#2a1530;color:#fff;font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
#net[hidden]{display:none}

/* phone: when the header carries moderator controls, put them on their own line so the title has room */
@media (max-width:640px){header.top:has(>.row){flex-wrap:wrap}header.top:has(>.row) .brand{flex:1 1 100%}header.top:has(>.row)>.row{order:-1;width:100%;justify-content:flex-end;flex-wrap:nowrap}header.top:has(>.row)>.row .pill{white-space:nowrap}}
.brand h1{overflow-wrap:normal;padding-bottom:.08em}
.glrows{max-height:60vh;overflow:auto}
.glrows .evrow{display:flex;align-items:center;gap:10px;padding:8px 10px}.glrows .evrow .mw0{flex:1;min-width:0}.glrows .evrow .gnum{width:16px}
.glrows .pill:not(.ok):not(.live){background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted)}
textarea{font:inherit;color:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
/* ===== Design: ribbons, title mark, moods ===== */
@property --mood-a{syntax:'<color>';inherits:true;initial-value:transparent}
@property --mood-b{syntax:'<color>';inherits:true;initial-value:transparent}
:root{--mood-a:color-mix(in srgb,var(--violet) 8%,transparent);--mood-b:color-mix(in srgb,var(--leaf) 6%,transparent);transition:--mood-a 2.6s ease,--mood-b 2.6s ease}
:root[data-mood="warm"]{--mood-a:color-mix(in srgb,var(--flame) 26%,transparent);--mood-b:color-mix(in srgb,var(--gold) 20%,transparent)}
:root[data-mood="bright"]{--mood-a:color-mix(in srgb,var(--rose) 22%,transparent);--mood-b:color-mix(in srgb,var(--sky) 14%,transparent)}
:root[data-mood="gold"]{--mood-a:color-mix(in srgb,var(--gold) 30%,transparent);--mood-b:color-mix(in srgb,var(--rose) 12%,transparent)}
#ribbons{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%,var(--mood-a),transparent 70%),radial-gradient(90% 60% at 50% 105%,var(--mood-b),transparent 70%)}
#ribbons .rb{position:absolute;inset:-6%}
#ribbons svg{position:absolute;inset:0;width:100%;height:100%;display:block}
@media print{#ribbons{display:none}}
/* big screen: slow drift */
.drift #ribbons .rb{animation:rbdrift 46s ease-in-out infinite alternate}
.drift #ribbons .rb1{animation-duration:58s;animation-direction:alternate-reverse}
.drift #ribbons .rb2{animation-duration:52s}
.drift #ribbons .rb3{animation-duration:38s;animation-direction:alternate-reverse}
.drift #ribbons .rb4{animation-duration:64s}
@keyframes rbdrift{from{transform:translate3d(-2.5%,-1.5%,0)}to{transform:translate3d(2.5%,1.8%,0)}}
/* big screen: ribbons sweep in, then the welcome appears */
.opening #ribbons svg{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 45%,transparent 55%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:rbsweep 2.4s cubic-bezier(.55,.05,.3,1) both}
.opening #ribbons .rb1 svg{animation-delay:.25s}.opening #ribbons .rb2 svg{animation-delay:.5s}.opening #ribbons .rb3 svg{animation-delay:.15s}.opening #ribbons .rb4 svg{animation-delay:.8s;animation-duration:2.6s}
@keyframes rbsweep{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
.opening .wrap{animation:openin 1.2s 1.5s ease both}
@keyframes openin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.drift #ribbons .rb,.opening #ribbons svg,.opening .wrap{animation:none}}

/* ---------- crossword layout ---------- */
let cwCache={key:null,val:null};
function buildCW(list){
 const key=JSON.stringify(list.map(x=>x.w));if(cwCache.key===key)return cwCache.val;
 const g={},placed=[];const words=list.map(x=>String(x.w||"").toUpperCase().replace(/[^A-Z]/g,"")).filter(w=>w.length>=2);
 const can=(w,r,c,d)=>{const[dr,dc]=d==="A"?[0,1]:[1,0];let k=0;
  if(g[(r-dr)+","+(c-dc)]||g[(r+dr*w.length)+","+(c+dc*w.length)])return -1;
  for(let i=0;i<w.length;i++){const p=[r+dr*i,c+dc*i],ch=g[p];
   if(ch){if(ch!==w[i])return -1;k++}else if(g[(p[0]+dc)+","+(p[1]+dr)]||g[(p[0]-dc)+","+(p[1]-dr)])return -1}return k};
 const put=(w,r,c,d)=>{const[dr,dc]=d==="A"?[0,1]:[1,0];for(let i=0;i<w.length;i++)g[(r+dr*i)+","+(c+dc*i)]=w[i];placed.push({w,r,c,d})};
 const order=words.slice().sort((a,b)=>b.length-a.length);let rest=[];
 if(order.length){put(order[0],0,0,"A");rest=order.slice(1)}
 for(let pass=0;pass<4;pass++){const left=[];for(const w of rest){let best=null;
   for(const key2 of Object.keys(g)){const[pr,pc]=key2.split(",").map(Number),ch=g[key2];
    for(let i=0;i<w.length;i++){if(w[i]!==ch)continue;for(const d of["A","D"]){const r=d==="A"?pr:pr-i,c=d==="A"?pc-i:pc;const k=can(w,r,c,d);if(k>0&&(!best||k>best[0]))best=[k,r,c,d]}}}
   if(best)put(w,best[1],best[2],best[3]);else left.push(w)}rest=left}
 if(!placed.length){cwCache={key,val:{R:0,C:0,placed:[],starts:{},sol:{},unplaced:words}};return cwCache.val}
 const ks=Object.keys(g).map(k=>k.split(",").map(Number));const r0=Math.min(...ks.map(k=>k[0])),c0=Math.min(...ks.map(k=>k[1]));
 const Rr=Math.max(...ks.map(k=>k[0]))-r0+1,Cc=Math.max(...ks.map(k=>k[1]))-c0+1;
 placed.forEach(p=>{p.r-=r0;p.c-=c0;const idx=list.findIndex(x=>String(x.w||"").toUpperCase().replace(/[^A-Z]/g,"")===p.w);p.id=idx;p.item=list[idx]});
 const starts={};let n=0;placed.slice().sort((a,b)=>a.r-b.r||a.c-b.c).forEach(p=>{const k=p.r+","+p.c;if(!starts[k])starts[k]=++n;p.num=starts[k]});
 const sol={};placed.forEach(p=>{for(let i=0;i<p.w.length;i++)sol[p.d==="A"?p.r+","+(p.c+i):(p.r+i)+","+p.c]=p.w[i]});
 cwCache={key,val:{R:Rr,C:Cc,placed,starts,sol,unplaced:rest}};return cwCache.val}
const CWG=()=>buildCW(CWW());
const cellsOf=p=>[...Array(p.w.length)].map((_,i)=>p.d==="A"?p.r+","+(p.c+i):(p.r+i)+","+p.c);
const cwClue=p=>L.lang==="es"&&p.item&&p.item.es?p.item.es:(p.item?p.item.c:"");

function seeded(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function cardFor(id,round){const r=seeded(EV+"|"+id+"|"+round);const cols=[];for(let c=0;c<5;c++){const a=[...Array(15)].map((_,i)=>c*15+i+1);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}cols.push(a.slice(0,5))}cols[2][2]=0;return cols}
function hasBingo(card,isOn){const m=n=>n===0||isOn(n);for(let i=0;i<5;i++){if([0,1,2,3,4].every(j=>m(card[j][i])))return true;if([0,1,2,3,4].every(j=>m(card[i][j])))return true}
 return [0,1,2,3,4].every(j=>m(card[j][j]))||[0,1,2,3,4].every(j=>m(card[j][4-j]))}

function myTiles(){const lw=D.mine.lw||{},got=lw.got||{};const out=[{l:P(L.me).word[0],from:"your word"}];Object.keys(got).sort((a,b)=>(+got[a]||0)-(+got[b]||0)).forEach(id=>{if(D.players[id])out.push({l:P(id).word[0],from:P(id).name})});return out}
function gLong(){
 const lw=D.mine.lw||{},got=lw.got||{},lock=lw.lock||{},end=st().lwEnd,over=end&&now()>end;
 const timer=end?(over?`<span class="pill no">${t("Time's up")}</span>`:`<span class="pill warn num" data-timer="${end}">${fmtLeft(end)}</span>`):`<span class="pill warn">${t("Waiting for the timer")}</span>`;
 const tiles=myTiles().map((x,k,a)=>`<div class="tile ${k===a.length-1&&L.lwNew===k?"new":""}" title="${esc(x.from)}">${x.l}<small>1</small></div>`).join("");
 const names=ids().filter(i=>i!==L.me).map(i=>{const cls=got[i]?"got":lock[i]?"lock":"";return `<button class="${cls}" data-act="lwSel" data-id="${i}" aria-pressed="${L.lwSel===i}"><span>${av(i,18)} ${esc(P(i).name)}</span><span>${got[i]?"✓":lock[i]?"✕":""}</span></button>`}).join("");
 let q=`<p class="muted small">${t("Tap a name, then ask that person their question in person.")}</p>`;
 if(L.lwSel&&D.players[L.lwSel]){const i=L.lwSel,p=P(i),f=FQ[p.fq]||FQ[0],opts=L.lang==="es"?f.es.o:f.o;
  if(got[i])q=`<p>${t("{name}'s word is {w}. You earned the tile {l}.",{name:`<b>${esc(p.name)}</b>`,w:`<b>${p.word}</b>`,l:`<b>${p.word[0]}</b>`})}</p>`;
  else if(lock[i])q=`<p>${t("{name}'s word is locked. You get one try per person.",{name:`<b>${esc(p.name)}</b>`})}</p>`;
  else q=`<div class="eyebrow">${t("Ask {name}",{name:esc(p.name)})}</div><p class="qtext">${esc(L.lang==="es"?f.es.q:f.q)}</p><div class="opts">${opts.map((o,k)=>`<button data-act="lwAns" data-k="${k}" ${over?"disabled":""}>${esc(o)}</button>`).join("")}</div>`}

 return `<div class="row between"><span class="muted small">${t("Your secret word:")} <b>${P(L.me).word}</b> · ${t("{n} tiles",{n:myTiles().length})}</span>${timer}</div>

/* Trivia */
function gTrivia(){
 const list=TRV(),qi=Math.min(st().tvQ||0,list.length-1),it=list[qi];if(!it)return `<div class="card muted">${t("Starting soon")}</div>`;
 const opts=trivO(it),ans=it.a,pk=podOf(L.me);
 if(!pk)return `<div class="card muted">${t("You joined after pods were set. Ask the moderator to reset the pods, or cheer on this round.")}</div>`;
 const votes=D.tv[qi]||{},res=(votes._res||{})[pk],phase=st().tvPhase||"vote",tie=st().tvTie||{};
 const inRevote=phase==="revote"&&tie[pk];
 const myVote=inRevote?((D.tvr||{})[qi]||{})[L.me]:votes[L.me];
 const locked=res||(phase!=="vote"&&!inRevote);
 const ch=opts.map((o,k)=>`<button class="choice ${res&&k===ans?"right":""}" data-act="tvVote" data-k="${k}" aria-pressed="${myVote===k}" ${locked?"disabled":""}><span><b class="gnum il">${"ABCD"[k]}</b> ${esc(o)}</span></button>`).join("");
 let msg=`<p class="small muted m0">${t("Your pod: {names}. Talk it over. The majority picks your pod's answer. No speed bonus.",{names:podMembers(pk).map(i=>esc(P(i).name)).join(", ")})}</p>`;
 if(inRevote)msg=`<div class="banner"><span>${t("Your pod tied. Talk it over and vote again.")}</span><span class="num" data-timer="${st().tvRevoteEnd}">${fmtLeft(st().tvRevoteEnd)}</span></div>`;
 if(res){msg=`<div class="card soft">${res.tie?`<b>${t("Your pod stayed tied. No points this question.")}</b>`:res.correct?`<b>${t("Your pod picked \"{a}\". Correct!",{a:esc(opts[res.pick])})}</b> ${t("Everyone in your pod gets {p} points.",{p:pv("trivia")})}`:`<b>${t("Your pod picked \"{a}\".",{a:esc(opts[res.pick])})}</b> ${t("The answer was \"{a}\".",{a:esc(opts[ans])})}`}</div>`;
  const rk=qi+"|"+pk;if(!L.seenRes[rk]){L.seenRes[rk]=1;if(res.correct){setTimeout(()=>{confetti(90);SND.ding();buzz([50,30,100])},50)}}}
 else if(myVote!=null&&!inRevote)msg+=`<p class="pill ok as">${t("Vote in. Waiting for the moderator to close voting.")}</p>`;
 return `<section class="card stack"><div class="row between"><span class="eyebrow">${t("Question {i} of {n}",{i:qi+1,n:list.length})}</span><span class="pill ${teamOf(L.me).toLowerCase()}">${t("Pod {p}",{p:pk})}</span></div><h2 class="qh">${esc(trivQ(it))}</h2>${it.hard?`<span class="pill no as">${t("Hard one")}</span>`:""}<div class="choices">${ch}</div>${msg}</section>`}

function gCross(){

 const act=L.cwAct!=null?G.placed[L.cwAct]:null,actCells=new Set(act?cellsOf(act):[]);
 const done=new Set();G.placed.forEach(p=>{if(solved[p.id])cellsOf(p).forEach(k=>done.add(k))});
 for(let r=0;r<G.R;r++)for(let c=0;c<G.C;c++){const k=r+","+c;
  if(!G.sol[k]){cells+=`<div class="cell blk"></div>`;continue}

  cells+=`<div class="cell">${G.starts[k]?`<span class="n">${G.starts[k]}</span>`:""}<input maxlength="1" data-cell="${k}" value="${v}" class="${done.has(k)?"done":actCells.has(k)?"hl":""}" ${done.has(k)?"readonly":""} autocomplete="off" autocapitalize="characters" aria-label="Row ${r+1} column ${c+1}"></div>`}

 const n=G.placed.filter(p=>solved[p.id]).length,partners=L.cwPartners.filter(i=>D.players[i]);
 return `<div class="row between"><span class="muted small">${t("{n} of {m} words · {p} pt each",{n,m:G.placed.length,p:pv("crossword")})}</span>${L.lang==="es"?`<span class="small muted">${t("Answers are in English.")}</span>`:""}</div>
 <section class="card stack tight"><span class="small"><b>${t("Sharing this screen?")}</b> ${t("Add who's solving with you. Everyone here gets full points.")}</span>
 <div class="row">${partners.map(i=>`<span class="pill ok">${esc(P(i).name)} <button class="btn xs" data-act="cwDrop" data-id="${i}" aria-label="Remove">×</button></span>`).join("")}<select id="cwAdd" data-act="cwAdd"><option value="">${t("Add a partner…")}</option>${ids().filter(i=>i!==L.me&&!partners.includes(i)).map(i=>`<option value="${i}">${esc(P(i).name)}</option>`).join("")}</select></div></section>
 <section class="cwbox">${WM}<div class="cw" style="grid-template-columns:repeat(${G.C},minmax(0,1fr))">${cells}</div></section>

/* Superlatives */
function gSup(){
 const list=SUPS(),qi=Math.min(st().supQ||0,list.length-1),it=list[qi];if(!it)return "";
 const votes=D.sup[qi]||{},res=votes._res,pair=st().supPair||[],my=votes[L.me],opts=SUPOPT();
 const upFront=pair.filter(i=>D.players[i]).map(i=>esc(P(i).name)).join(" &amp; ")||t("to be picked");
 const ch=opts.map((o,k)=>`<button class="choice" data-act="supVote" data-k="${k}" aria-pressed="${my===k}" ${res?"disabled":""}><span>${esc(o)}</span></button>`).join("");
 let out=`<section class="card stack"><div class="row between"><span class="eyebrow">${t("Question {i} of {n}",{i:qi+1,n:list.length})}</span><span class="small muted">${t("Up front: {names}",{names:upFront})}</span></div><h2 class="qh">${esc(supLine(it))}</h2><div class="choices">${ch}</div>
 <p class="small muted m0">${pair.includes(L.me)?t("You're up front! Vote without looking at your partner."):t("You're voting with {team}.",{team:esc(teamName(teamOf(L.me)))})} ${t("If the pair agrees, they each score. If not, the team that agrees more strongly takes the round.")}</p>${my!=null&&!res?`<p class="pill ok as">${t("Vote in")}</p>`:""}</section>`;
 if(res)out+=supResult(res);return out}
function supResult(r){const opts=SUPOPT();const row=(tm,pct,top)=>`<div class="stack tight"><div class="row between small"><span class="pill ${tm.toLowerCase()}">${esc(teamName(tm))}</span><span class="num">${t("{pct}% picked {name}",{pct,name:esc(opts[top]||"")})}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
 return `<section class="card stack"><h3>${t("Results")}</h3>${r.pa!=null?`<p class="small m0">${esc(r.na)} → <b>${esc(opts[r.pa]||"")}</b> · ${esc(r.nb)} → <b>${r.pb!=null?esc(opts[r.pb]||""):"—"}</b></p>`:""}${row("A",r.pctA,r.topA)}${row("B",r.pctB,r.topB)}<p class="m0"><b>${esc(r.msg)}</b></p></section>`}

/* Bingo */
function gBingo(){
 const round=st().bingoRound||1,called=st().called||[],card=cardFor(L.me,round),mk=L.marks[round]||[];
 const last=called[called.length-1],claim=((D.claims||{})[round]||{})[L.me];
 let grid='<div class="bingo">'+"BINGO".split("").map(l=>`<div class="h">${l}</div>`).join("");
 for(let r=0;r<5;r++)for(let c=0;c<5;c++){const n=card[c][r];grid+=n===0?`<button class="free" disabled>FREE</button>`:`<button class="${mk.includes(n)?"m":""}" data-act="bMark" data-n="${n}">${n}</button>`}
 grid+="</div>";
 const claimUI=claim?(claim.ok?`<p class="pill ok asc">${t("Bingo confirmed! +{p} points",{p:pv("bingo")})}</p>`:`<p class="pill warn asc">${t("Bingo sent. Waiting for the moderator to confirm.")}</p>`):`<button class="btn gold big" data-act="bCall">BINGO!</button>`;
 return `<section class="card row between"><div><span class="eyebrow">${t("Round {r} · last call",{r:round})}</span><h2>${last?letter(last)+"-"+last:t("Starting soon")}</h2><span class="small muted">${t("{n} numbers called",{n:called.length})}</span></div>${last?`<div class="ball" key="${last}">${letter(last)}${last}</div>`:""}</section>
 <section class="card stack">${grid}${claimUI}<p class="small muted m0 tc">${t("Tap numbers as they're called. A full row, column or diagonal wins.")}</p></section>`}

/* Scavenger hunt */
function pHunt(){
 const mine=D.mine.hunt||{},list=HUNTS();
 const items=list.map((it,k)=>{const s=mine[k];
  const tag=s==="ok"?`<span class="pill ok">${t("Found")}</span>`:s==="up"?`<span class="pill warn">${t("Saving…")}</span>`:`<label class="btn sm primary upl">${s==="removed"?t("Try again"):t("Snap it")}<input type="file" accept="image/*" capture="environment" data-act="huntUp" data-k="${k}" aria-label="${t("Mystery item {n}",{n:k+1})}"></label>`;
  return `<div class="item"><div class="thumb">${k+1}</div><div><b class="db">${s==="ok"?esc(loc(it,"n")):t("Mystery item {n}",{n:k+1})}</b><span class="small muted">${esc(loc(it,"h"))}</span>${s==="removed"?`<span class="small db bad">${t("The moderator didn't accept that photo.")}</span>`:""}</div>${tag}</div>`}).join("");
 const found=Object.values(mine).filter(v=>v==="ok").length;
 return `<section class="card stack"><div class="row between"><div><span class="eyebrow">${t("Open until the end of the night")}</span><h2>${esc(gname(GAMES[2]))}</h2></div><div class="score num sm">${found}/${list.length}</div></div><p class="small muted m0">${t("Find them in any order and take a photo of each. {p} points per item. The moderators check every photo.",{p:pv("hunt")})}</p></section><div class="hunt">${items}</div>`}

function mLive(){
 const live=st().live;
 const cgs=Object.keys(cgAll()).sort((a,b)=>(cgAll()[a].t||0)-(cgAll()[b].t||0)).map(id=>({id:"c:"+id,name:cgAll()[id].name,note:"Custom game"}));
 const rows=enabledGames().concat(cgs).map((g,k)=>`<div class="gamerow ${live===g.id?"on":""}"><span class="gnum">${k+1}</span><div><b>${g.name}</b><div class="small muted">${g.note}</div></div>${live===g.id?`<button class="btn sm" data-act="endGame">End</button>`:`<button class="btn sm primary" data-act="goLive" data-id="${g.id}">Go live</button>`}</div>`).join("");
 return `${checklist()}${st().moment?`<div class="banner"><span>On the TV: <b>${esc((momentsList().find(x=>x.id===st().moment.id)||{name:"a moment"}).name)}</b>. Games still run underneath.</span><button class="btn sm" data-act="moStop">Take it off</button></div>`:""}<section class="card stack"><div class="row between"><h2>Tonight's games</h2><span class="small muted">${ids().length} guests joined · going live runs a 5-second countdown on every phone</span></div><div class="gamelist">${rows}</div></section>${tools()}${reviewQueue()}
 <section class="card stack"><h3>Send an announcement</h3><div class="row"><input type="text" id="annText" class="grow" data-draft="ann" value="${esc(dv("ann",""))}" placeholder="Bingo starts in 5 minutes!"><button class="btn primary" data-act="announce">Send to every phone</button></div></section>`}
function paceBar(done,total,since,label){const pct=total?Math.round(100*done/total):0;const secs=since?Math.round((now()-since)/1000):0;
 let nudge="";if(total&&pct>=80)nudge=`<div class="nudge">Most guests have ${label}. Move on when you're ready.</div>`;else if(since&&secs>75)nudge=`<div class="nudge">It's been over a minute. Consider moving on.</div>`;
 return `<div class="stack tight"><div class="row between small"><span><b class="num">${done}</b> of ${total} ${label}</span><span class="num muted">${pct}%${since?` · ${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}`:""}</span></div><div class="bar"><i style="width:${pct}%"></i></div>${nudge}</div>`}
function tools(){

  return `<section class="card stack"><div class="row between"><h3>Bingo caller · round ${round}</h3><div class="row">${last?`<div class="ball sm">${letter(last)}${last}</div>`:""}<button class="btn primary" data-act="callNext">Call next number</button><button class="btn" data-act="newBingo">New round</button></div></div>${pend?`<div class="nudge">${pend} bingo call${pend>1?"s":""} waiting for you.</div>`:""}<div class="tscroll">${board}</div>${claims?`<h3>Bingo calls</h3>${claims}`:'<p class="small muted m0">Bingo calls from guests show up here, already checked against their cards.</p>'}</section>`}

 if(id==="sup"){const list=SUPS(),qi=Math.min(st().supQ||0,list.length-1),v=D.sup[qi]||{},pair=st().supPair||["",""];const voted=Object.keys(v).filter(k=>k!=="_res").length;

 if(id==="split"){return `<section class="card stack"><h3>Team Splitter</h3><p class="small muted m0">Guests see their team and can suggest team names. Set the final names in the Teams tab.</p><button class="btn as" data-act="mtab" data-k="teams">Open Teams</button></section>`}

/* ---- Content: lists, answer key, editor, AI helper ---- */
const KINDS={trivia:"Trivia",hunt:"Scavenger Hunt",cw:"Crossword",sups:"Superlatives",tie:"Tiebreaker"};
function cleanLine(s){return s.replace(/^\s*(?:\d+[.)]|[-*•])\s*/,"").trim()}
function toText(kind){const c=C();
 if(kind==="trivia")return TRV().map(x=>`${x.q} | ${x.o.join(" | ")} | ${"ABCD"[x.a]||"A"}${x.hard?" | hard":""}`+(x.es&&x.es.q?`\nes: ${x.es.q} | ${arr(x.es.o).join(" | ")}`:"")).join("\n");
 if(kind==="hunt")return HUNTS().map(x=>`${x.n} | ${x.h}`+(x.es&&x.es.n?`\nes: ${x.es.n} | ${x.es.h||""}`:"")).join("\n");
 if(kind==="cw")return CWW().map(x=>`${x.w} | ${x.c}`+(x.es?`\nes: ${x.es}`:"")).join("\n");
 if(kind==="sups")return SUPS().map(x=>x.q+(x.es?`\nes: ${x.es}`:"")).join("\n");
 if(kind==="tie"){const x=c.tie||{};return `${x.q||""} | ${x.a==null?"":x.a}`+(x.es?`\nes: ${x.es}`:"")}}
function parseKind(kind,text){const out=[],errs=[];const lines=String(text||"").split(/\r?\n/);
 lines.forEach((raw,n)=>{const line=cleanLine(raw);if(!line||/^```/.test(line))return;
  const isEs=/^es\s*:/i.test(line);const body=line.replace(/^es\s*:\s*/i,"");const parts=body.split("|").map(s=>s.trim());
  if(isEs){const last=out[out.length-1];if(!last){errs.push(n+1);return}
   if(kind==="trivia"){if(parts.length>=5)last.es={q:parts[0],o:parts.slice(1,5)};else errs.push(n+1)}
   else if(kind==="hunt")last.es={n:parts[0],h:parts[1]||""};
   else last.es=body.trim();return}
  if(kind==="trivia"){if(parts.length<6){errs.push(n+1);return}const a="ABCD".indexOf(parts[5].toUpperCase().replace(/[^A-D]/g,"")[0]);if(a<0){errs.push(n+1);return}
   out.push({q:parts[0],o:parts.slice(1,5),a,hard:/hard/i.test(parts.slice(6).join(" "))||undefined})}
  else if(kind==="hunt"){if(parts.length<2||!parts[0]){errs.push(n+1);return}out.push({n:parts[0],h:parts[1]})}
  else if(kind==="cw"){const w=(parts[0]||"").toUpperCase().replace(/[^A-Z]/g,"");if(w.length<2||!parts[1]){errs.push(n+1);return}out.push({w,c:parts[1]})}
  else if(kind==="sups"){let q=body.replace(/^who('s| is)? (most )?likely to\s*/i,"").trim();if(!q){errs.push(n+1);return}if(!/[?]$/.test(q))q+="?";out.push({q:q.charAt(0).toUpperCase()+q.slice(1)})}
  else if(kind==="tie"){const a=parseFloat((parts[1]||"").replace(/[^0-9.\-]/g,""));if(!parts[0]||isNaN(a)){errs.push(n+1);return}out.push({q:parts[0],a})}});
 out.forEach(o=>{Object.keys(o).forEach(k=>o[k]===undefined&&delete o[k])});return {items:out,errs}}
function promptFor(kind){const c=C();const n=+dv("aiN_"+kind,{trivia:10,hunt:8,cw:12,sups:8,tie:1}[kind]);const es=dv("aiEs_"+kind,"1")==="1";
 const theme=((c.themeDesc||c.title||"a party")+(c.honorees?` honoring ${c.honorees}`:"")).replace(/[.\s]+$/,"");
 const head=`I'm hosting ${theme}. I'm running party games on guests' phones.`;
 const fmt="Reply with only the list, one item per line, in exactly this format, with no numbering, headings or extra text:";
 if(kind==="trivia")return `${head} Write ${n} multiple-choice trivia questions that fit this theme. Make most of them fun and easy, and about ${Math.max(1,Math.round(n*.3))} hard ones that most guests will have to guess. Each question has exactly 4 answer choices written in the same style (for example, all exact numbers or all short phrases), with only one correct answer.\n\n${fmt}\nQuestion | choice A | choice B | choice C | choice D | letter of the correct choice\nAdd " | hard" to the end of each hard question's line.${es?`\nRight after each question line, add a Spanish translation line in this format:\nes: pregunta | opción A | opción B | opción C | opción D`:""}\n\nExample:\nHow many bones is a newborn born with? | 100 | 206 | 300 | 500 | C${es?"\nes: ¿Con cuántos huesos nace un recién nacido? | 100 | 206 | 300 | 500":""}`;
 if(kind==="hunt")return `${head} Suggest ${n} scavenger hunt items the host can hide around the venue. They should fit the theme, be small, easy to buy or find, and easy to photograph. For each item, write a short playful hint that describes it without naming it.\n\n${fmt}\nItem name | hint${es?`\nRight after each line, add a Spanish line in this format:\nes: nombre | pista`:""}\n\nExample:\nRubber duck | I float through every bath time.${es?"\nes: Patito de goma | Floto en cada hora del baño.":""}`;
 if(kind==="cw")return `${head} Suggest ${n} English words for a crossword that fit this theme. Each word must be a single word with letters only (no spaces or hyphens), 3 to 9 letters long. Choose words that share common letters so they interlock well. For each word, write a short, friendly clue.\n\n${fmt}\nWORD | clue${es?`\nRight after each line, add the clue in Spanish (the answer stays in English) in this format:\nes: pista`:""}\n\nExample:\nCRADLE | A bed that rocks${es?"\nes: Una cama que se mece":""}`;
 if(kind==="sups")return `${head} Guests vote on "Who is most likely to…" questions, choosing between ${SUPOPT().join(" and ")}. Write ${n} fun, kind questions that fit this theme. Write only the ending of each question, starting with a verb and ending with a question mark.\n\n${fmt}\nending of the question?${es?`\nRight after each line, add the Spanish ending in this format (it follows "¿Quién tiene más probabilidades de"):\nes: final de la pregunta?`:""}\n\nExample:\nCry the hardest when the baby is born?${es?"\nes: llorar más fuerte cuando nazca el bebé?":""}`;
 if(kind==="tie")return `${head} Write one tiebreaker question for the end of the night that has a single number as its answer, so the team whose guess is closest wins. It should fit the theme and be hard to know exactly.\n\n${fmt}\nQuestion | number${es?`\nThen add a Spanish line:\nes: pregunta`:""}\n\nExample:\nHow many diapers does a baby use in its first year? | 2500${es?"\nes: ¿Cuántos pañales usa un bebé en su primer año?":""}`}
function keyView(kind){
 if(kind==="trivia")return `<ol class="keylist">${TRV().map(x=>`<li><b>${esc(x.q)}</b>${x.hard?' <span class="pill no">Hard</span>':""}<div class="key">${x.o.map((o,k)=>`<span class="${k===x.a?"right":""}"><b>${"ABCD"[k]}</b> ${esc(o)}${k===x.a?" ✓":""}</span>`).join("")}</div>${x.es&&x.es.q?`<div class="small muted">ES: ${esc(x.es.q)}</div>`:""}</li>`).join("")}</ol>`;
 if(kind==="hunt")return `<ol class="keylist">${HUNTS().map(x=>`<li><b>${esc(x.n)}</b> <span class="muted">· ${esc(x.h)}</span></li>`).join("")}</ol>`;
 if(kind==="cw"){const G=CWG();return `<p class="small m0">${G.placed.length} of ${CWW().length} words fit in the puzzle.${G.unplaced.length?` <span class="bad">Not used: ${esc(G.unplaced.join(", "))}. Try words that share more letters.</span>`:""}</p><ol class="keylist">${CWW().map(x=>`<li><b>${esc(x.w)}</b> <span class="muted">· ${esc(x.c)}</span></li>`).join("")}</ol>`}
 if(kind==="sups")return `<p class="small m0">Answer choices: <b>${esc(SUPOPT().join(" · "))}</b> (change them in Event)</p><ol class="keylist">${SUPS().map(x=>`<li>Who is most likely to ${esc(supQ(x))}</li>`).join("")}</ol>`;
 if(kind==="tie"){const x=C().tie||{};return `<p class="m0"><b>${esc(x.q||"")}</b> <span class="pill ok">Answer: ${esc(x.a)}</span></p>`}}
function mContent(){markSetup("content");
 const k=L.ctab,mode=(L.cmode||{})[k]||"view";const sub=Object.keys(KINDS).map(x=>`<button data-act="ctab" data-k="${x}" aria-pressed="${k===x}">${KINDS[x]}</button>`).join("");

  <li>Copy this request and paste it into Claude.<textarea id="aiPrompt" rows="8" readonly>${esc(pr)}</textarea><div class="row"><button class="btn primary" data-act="copyPrompt">Copy request</button><a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a></div></li>
  <li>Paste Claude's answer here.<textarea id="ai_${k}" data-draft="ai_${k}" rows="8" spellcheck="false" placeholder="Paste the answer…">${esc(pasted)}</textarea>${parsed?`<p class="small m0">${parsed.items.length} item${parsed.items.length===1?"":"s"} ready${parsed.errs.length?` · <span class="bad">couldn't read line${parsed.errs.length>1?"s":""} ${parsed.errs.join(", ")}</span>`:""}</p>`:""}
  <div class="row"><button class="btn primary" data-act="aiApply" data-k="${k}" data-how="replace" ${parsed&&parsed.items.length?"":"disabled"}>Replace the list</button>${k!=="tie"?`<button class="btn" data-act="aiApply" data-k="${k}" data-how="add" ${parsed&&parsed.items.length?"":"disabled"}>Add to the list</button>`:""}<button class="btn" data-act="cmode" data-k="${k}" data-m="view">Cancel</button></div></li></ol>`}
 else body=keyView(k);
 return `<section class="card stack"><div class="row between"><h2>Game content</h2><span class="small muted">Theme: ${esc(C().themeDesc||C().title||"")}</span></div><div class="seg wrapseg" role="group" aria-label="Content type">${sub}</div></section>
 <section class="card stack"><div class="row between"><h3>${KINDS[k]}${k==="tie"?"":` · ${count}`}${k==="trivia"?" · answer key":""}</h3><div class="row">${mode==="view"?`<button class="btn sm" data-act="cmode" data-k="${k}" data-m="edit">Edit list</button><button class="btn sm primary" data-act="cmode" data-k="${k}" data-m="ai">Get ideas with AI</button>`:""}</div></div>${body}</section>`}
function formatHelp(k){return {trivia:"One question per line: Question | A | B | C | D | correct letter. Add | hard for hard ones. Optional Spanish line below it: es: pregunta | a | b | c | d",
 hunt:"One item per line: Item | hint. Optional Spanish line below it: es: objeto | pista",cw:"One word per line: WORD | clue. Optional Spanish clue below it: es: pista",
 sups:"One question ending per line, for example: Spoil the baby rotten? Optional Spanish line below it: es: consentir demasiado al bebé?",tie:"Question | number answer. Optional Spanish line below it: es: pregunta"}[k]}

const CG={frames:{},session:Math.random().toString(36).slice(2,10),stateRef:null,stateGid:null};
const CGR={gid:null,ref:null,queue:{},busy:false,ready:false,setupAsked:false,lastBot:0};
const cgAll=()=>(C().custom)||{};
const cgGame=gid=>cgAll()[gid]||null;
const liveCg=()=>{const l=st().live;return l&&String(l).startsWith("c:")?l.slice(2):null};
function gameById(id){if(id&&String(id).startsWith("c:")){const g=cgGame(id.slice(2));const n=g?g.name:"Custom game";return {id,name:n,es:n,note:g&&g.desc?g.desc:"Custom game",custom:true}}return GAMES.find(x=>x.id===id)}
function themeVars(){const cs=getComputedStyle(document.documentElement),o={};["--rose","--flame","--gold","--violet","--leaf","--sky","--ink","--muted","--card","--ground-2","--line"].forEach(k=>{const v=cs.getPropertyValue(k).trim();if(v)o[k]=v});o["--fs"]=L.large?"17.5px":"15px";return o}
/* settings are stored as JSON text so lists and empty values survive the database */
function cgSettings(g){if(!g||!g.settingsJson)return {};try{return JSON.parse(g.settingsJson)||{}}catch(e){return {}}}

function cgCtx(me,role,players){const g=cgGame(liveCg());return {settings:cgSettings(g),players:players||ids().map(i=>({id:i,name:P(i).name,team:teamOf(i),teamName:teamName(teamOf(i)),avatar:(P(i).av||{}).e||"",photo:(P(i).av||{}).img||"",bot:!!P(i).bot})),teams:{A:teamName("A"),B:teamName("B")},theme:{image:C().image||"",title:C().title||""},me:me||null,role,now:now()}}

class CGFrame{
 constructor(slot,role,code){this.slot=slot;this.role=role;this.code=code;this.ready=false;this.calls={};this.waiting=[];this.h=140;this.info={};this.last=null;
  const box=document.createElement("div");box.className="cgdock";box.dataset.dock=slot;box.style.display="none";document.body.appendChild(box);this.box=box;
  const f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts");f.setAttribute("title","Game");f.setAttribute("allow","");f.srcdoc=CG_SRCDOC;box.appendChild(f);this.f=f}
 post(m){try{this.f.contentWindow&&this.f.contentWindow.postMessage(m,"*")}catch(e){}}
 onMsg(m){
  if(m.type==="boot"){this.post({type:"load",code:this.code,role:this.role,vars:themeVars(),offset:L.offset})}
  else if(m.type==="ready"){this.ready=true;this.info=m;this.waiting.splice(0).forEach(go=>go());if(this.last)this.post(this.last);this.onReady&&this.onReady(m)}
  else if(m.type==="height"){this.h=Math.max(60,m.h);syncFrames()}
  else if(m.type==="act"){this.onAct&&this.onAct(m.action)}
  else if(m.type==="error"){this.onError?this.onError(m):cgReportError(m)}
  else if(m.type==="result"){const c=this.calls[m.id];if(c){clearTimeout(c.t);delete this.calls[m.id];c.res(m)}}
  else if(m.type==="media"){const k=String(m.key||"").replace(/[^A-Za-z0-9_-]/g,"");if(!k)return;(this.mediaSrc?Promise.resolve(this.mediaSrc(k)):ER("cgmedia/"+k).once("value").then(s=>{const v=s.val();return v&&typeof v==="object"?v.img:v})).then(src=>{if(src)this.post({type:"media",key:k,src})})}}
 render(state,ctx){this.last={type:"render",state:state||{},ctx,offset:L.offset};if(this.ready)this.post(this.last)}
 call(fn,payload){return new Promise((res,rej)=>{const id=Math.random().toString(36).slice(2);const go=()=>{this.calls[id]={res,t:setTimeout(()=>{delete this.calls[id];rej(new Error("The game took too long to answer. It may be stuck in a loop."))},fn==="check"?7500:5000)};this.post(Object.assign({type:"call",id,fn},payload))};this.ready?go():this.waiting.push(go)})}
 destroy(){Object.values(this.calls).forEach(c=>clearTimeout(c.t));this.box.remove();if(CG.frames[this.slot]===this)delete CG.frames[this.slot]}}
window.addEventListener("message",e=>{const m=e.data;if(!m||!m.__cg)return;const fr=Object.values(CG.frames).find(x=>x.f.contentWindow===e.source);if(fr)fr.onMsg(m)});
function getFrame(slot,role,code){let f=CG.frames[slot];if(f&&f.code===code&&f.role===role)return f;if(f)f.destroy();f=new CGFrame(slot,role,code);CG.frames[slot]=f;return f}
function dropFrame(slot){const f=CG.frames[slot];if(f)f.destroy()}
/* frames float over placeholders, so re-drawing the page never reloads a running game */
function syncFrames(){Object.values(CG.frames).forEach(fr=>{const ph=document.querySelector(`.cgph[data-slot="${fr.slot}"]`);
 if(!ph||!ph.offsetParent&&ph.getClientRects().length===0){fr.box.style.display="none";return}
 ph.style.height=fr.h+"px";const r=ph.getBoundingClientRect();
 Object.assign(fr.box.style,{display:"block",left:(r.left+window.scrollX)+"px",top:(r.top+window.scrollY)+"px",width:r.width+"px",height:fr.h+"px"})})}
setInterval(syncFrames,300);window.addEventListener("resize",syncFrames);

function cgLiveState(){return CG.liveState||null}
function cgUpdate(){
 const gid=liveCg(),g=gid?cgGame(gid):null;

/* ---------- AI request for writing or fixing a game ---------- */
const CG_API=`HOW MY GAME ENGINE WORKS
- Your code must call defineGame({...}) exactly once. Plain JavaScript only: no imports, no network requests, no setTimeout or setInterval, no localStorage, no alert. Helper functions outside defineGame are fine.
- The game has ONE shared state: a plain JSON object (objects, arrays, strings, numbers, booleans; no functions or Dates). Only the host's device changes it, through setup, onAction, onHostAction and onTick. Every phone, the host controls and the TV then redraw from it.
- Render functions return an HTML string and must never change state or award points.

defineGame({
  title: "Short game name",
  settings: { /* quick settings the host can change later without code, see below */ },
  setup(ctx) { return { /* starting state */ }; },
  onAction(state, action, ctx) { /* a guest tapped something */ return state; },
  onHostAction(state, action, ctx) { /* the host tapped something on the host controls */ return state; },
  onTick(state, ctx) { /* optional: runs once a second on the host's device; use it to end timed rounds */ return state; },
  renderPlayer(state, ctx) { return "..."; },   // each guest's phone. ctx.me is that guest's id
  renderHost(state, ctx) { return "..."; },     // the host's controls (start rounds, reveal answers, next round, finish...)
  renderScreen(state, ctx) { return "..."; },   // the big TV everyone watches
  botAction(state, botId, ctx) { return { type: "...", value: ..., form: {...} } or null; }  // optional: what a pretend guest does in practice runs
});

QUICK SETTINGS (very important)
Put every choice a host might want to change later into settings, so it can be changed without touching code: game pieces and symbols (emoji, or a photo),
using guests' pictures as pieces, colors, line or border styles, words and labels, lists of questions or items, number of rounds, seconds per round and points.
Read the current values from ctx.settings everywhere, including setup. Example:
  settings: {
    pieceA:   { label: "Team A's piece", type: "text", default: "❌" },
    pieceB:   { label: "Team B's piece", type: "text", default: "⭕" },
    useAvatars: { label: "Use guests' pictures as pieces", type: "toggle", default: false },
    lineStyle: { label: "Board lines", type: "choice", options: ["solid", "dashed", "dotted", "double"], default: "solid" },
    lineColor: { label: "Line color", type: "color", default: "#7b3fb8" },
    seconds:  { label: "Seconds per turn", type: "number", default: 20, min: 5, max: 120 },
    backdrop: { label: "Background picture", type: "image", default: "" },
    words:    { label: "Words, one per line", type: "lines", default: ["CRIB", "BOTTLE"] }
  }
  Types: text, number, toggle (true/false), choice (needs options), color, image (a picture address, or "" when none; show it with <img src="...">),
  lines (an array of strings; for lists like "Item | price", split each line yourself). Add help: "..." to explain a setting.

action = { type, value, form, from, name, team }
  type  = the tapped element's data-action
  value = its data-value (number-looking values arrive as numbers), or a photo id for photo actions
  form  = values of all elements with a name="" inside the closest element that has data-form
  from  = the guest's id ("host" for host actions); name and team ("A" or "B") of that guest

ctx gives you:
  ctx.settings   current quick-setting values
  ctx.players    array of { id, name, team ("A"/"B"), teamName, avatar (an emoji), photo (picture address or "") }; guests can join at any time
  ctx.me         the guest's id on a phone; null on the host controls and the TV
  ctx.myTeam, ctx.teams = { A: "team name", B: "team name" }, ctx.player(id), ctx.name(id), ctx.playersOn("A")
  ctx.now        current time in ms, the same clock on every device
  ctx.random(), ctx.randInt(n), ctx.shuffle(array), ctx.pick(array)
  ctx.esc(text)  ALWAYS use this on names and anything guests typed before putting it in HTML
  ctx.award(guestId, points)        points to that guest and to their team (only in setup/onAction/onHostAction/onTick)
  ctx.awardTeam("A" or "B", points) team points only
  ctx.celebrate("Short message")    confetti and a big message on the TV
  ctx.formatTime(ms)                "1:05"

HTML building blocks
  Button:  <button class="btn primary" data-action="vote" data-value="2">Vote</button>
  Typing:  <div data-form><input name="guess" type="number" placeholder="Your guess"><button class="btn primary" data-action="guess">Send</button></div>
           (Enter also sends; the boxes clear after sending; typed text survives redraws)
  Photo:   <label class="btn primary">Take a photo<input type="file" accept="image/*" data-photo="photo"></label>
           sends an action with type "photo" and value = a photo id. Show a photo id with <img data-media="PHOTO_ID">. Store only ids in state.
  Timer:   <span class="timer" data-countdown="\${state.endsAt}" data-done="Time's up!"></span>  (counts down live; end the round in onTick)
  Animate: add data-anim-key="something-unique" to make an element pop in the first time it appears.
  Classes: card, stack, row, grid2, center, title (fancy script headline), big (huge word or number), muted, small, btn, btn primary, btn gold,
           choices + choice (big tappable answer buttons; add selected, right or wrong), pill, pill a, pill b (team colors), avatar, list, timer.
           Inline styles and CSS grid are fine (good for boards). Theme colors are CSS variables: --rose --flame --gold --violet --leaf --ink --muted.

Rules for a game that works on the night
  - Check every action in onAction: right phase, right player's turn, not answered twice, values make sense. Ignore anything else.
  - Every phase must show something useful on all three views, including guests who joined late and the host before the game starts.
  - Keep state small (well under 100 KB). Never put photos in state.
  - Guests can't see the host controls, so the host must be able to move the game forward from renderHost (start, reveal, next, finish).
  - Show a clear final result and award points with ctx.award or ctx.awardTeam.`;
const CG_EXAMPLE=`defineGame({
  title: "Guess the Price",
  settings: {
    items: { label: "Items, one per line as Name | price", type: "lines", default: ["Diaper Genie | 45", "Box of 100 wipes | 6", "Baby monitor | 89"] },
    seconds: { label: "Seconds to guess", type: "number", default: 45, min: 10, max: 180 },
    points: { label: "Points for the closest guess", type: "number", default: 5, min: 1, max: 50 },
    currency: { label: "Money symbol", type: "text", default: "$" }
  },
  setup(ctx) {
    const items = ctx.settings.items.map(line => { const [name, price] = line.split("|"); return { name: (name || "").trim(), price: Number(price) || 0 }; }).filter(i => i.name);
    return { items, round: 0, phase: "waiting", guesses: {}, endsAt: 0, winner: null };
  },
  onHostAction(state, a, ctx) {
    if (a.type === "open" && state.phase === "waiting") { state.phase = "guessing"; state.guesses = {}; state.endsAt = ctx.now + ctx.settings.seconds * 1000; }
    if (a.type === "reveal" && state.phase === "guessing") reveal(state, ctx);
    if (a.type === "next" && state.phase === "reveal" && state.round < state.items.length - 1) { state.round++; state.phase = "waiting"; state.winner = null; }
    return state;
  },
  onAction(state, a, ctx) {
    const g = Number(a.form.guess);
    if (a.type === "guess" && state.phase === "guessing" && !(a.from in state.guesses) && g > 0) state.guesses[a.from] = g;
    return state;
  },
  onTick(state, ctx) { if (state.phase === "guessing" && ctx.now > state.endsAt) reveal(state, ctx); return state; },
  renderPlayer(state, ctx) {
    const item = state.items[state.round], mine = state.guesses[ctx.me], $ = ctx.esc(ctx.settings.currency);
    if (!item) return '<div class="card center"><h2>No items yet</h2></div>';
    if (state.phase === "waiting") return \`<div class="card center"><p class="muted">Item \${state.round + 1} of \${state.items.length}</p><h2>Get ready to guess!</h2></div>\`;
    if (state.phase === "guessing") return mine ? \`<div class="card center"><h2>You guessed \${$}\${mine}</h2><p class="muted">Waiting for the reveal…</p></div>\`
      : \`<div class="card"><h2>How much is the \${ctx.esc(item.name)}?</h2><span class="timer" data-countdown="\${state.endsAt}" data-done="Time's up"></span>
         <div data-form class="row"><input name="guess" type="number" min="1" placeholder="Price"><button class="btn primary" data-action="guess">Guess</button></div></div>\`;
    return \`<div class="card center"><p class="muted">\${ctx.esc(item.name)}</p><div class="big" data-anim-key="price\${state.round}">\${$}\${item.price}</div>
      <p>\${state.winner ? ctx.esc(ctx.name(state.winner)) + " was closest!" : "No guesses this round."}</p></div>\`;
  },
  renderHost(state, ctx) {
    const item = state.items[state.round], n = Object.keys(state.guesses).length;
    if (!item) return '<p class="muted">Add items in Quick settings.</p>';
    return \`<div class="card"><h3>Item \${state.round + 1}: \${ctx.esc(item.name)} (\${ctx.esc(ctx.settings.currency)}\${item.price})</h3><p class="muted">\${n} guesses in</p><div class="row">
      \${state.phase === "waiting" ? '<button class="btn primary" data-action="open">Open guessing</button>' : ""}
      \${state.phase === "guessing" ? '<button class="btn primary" data-action="reveal">Reveal price</button>' : ""}
      \${state.phase === "reveal" && state.round < state.items.length - 1 ? '<button class="btn primary" data-action="next">Next item</button>' : ""}</div></div>\`;
  },
  renderScreen(state, ctx) {
    const item = state.items[state.round];
    if (!item) return '<div class="title center">Guess the Price</div>';
    if (state.phase === "reveal") return \`<div class="center stack"><div class="title">\${ctx.esc(item.name)}</div><div class="big" data-anim-key="s\${state.round}">\${ctx.esc(ctx.settings.currency)}\${item.price}</div><h2>\${state.winner ? ctx.esc(ctx.name(state.winner)) + " wins " + ctx.settings.points + " points!" : ""}</h2></div>\`;
    return \`<div class="center stack"><div class="title">Guess the Price</div><h2>\${state.phase === "guessing" ? ctx.esc(item.name) : "Next item coming up"}</h2>\${state.phase === "guessing" ? \`<span class="timer" data-countdown="\${state.endsAt}"></span>\` : ""}</div>\`;
  },
  botAction(state, botId, ctx) {
    return state.phase === "guessing" && !(botId in state.guesses) ? { type: "guess", form: { guess: String(1 + ctx.randInt(100)) } } : null;
  }
});
function reveal(state, ctx) {
  const price = state.items[state.round].price;
  let best = null;
  for (const id in state.guesses) { const d = Math.abs(state.guesses[id] - price); if (!best || d < best.d) best = { id, d }; }
  state.phase = "reveal"; state.winner = best ? best.id : null;
  if (best) { ctx.award(best.id, ctx.settings.points); ctx.celebrate(ctx.name(best.id) + " was closest!"); }
}`;

 <h4>How it works</h4><ol><li><b>Describe</b> the game in plain words in "Create a new game" below.</li><li><b>Copy the request</b> and paste it into Claude. The request already explains this app's game engine, so Claude knows exactly what to write.</li><li><b>Paste Claude's whole reply</b> back here and tap <b>Check and save</b>. The app plays simulated rounds on the phone, host controls and TV before anything is saved, and tells you if something is broken.</li><li><b>Test it</b> on the test bench: play as "Jamie (you)", run it from the host controls, and let pretend guests join in.</li><li><b>Practice</b> with a practice run (Event tab), then <b>go live</b> from the Live tab. It gets the same 5-second countdown as every other game.</li></ol>
 <h4>What to put in your description</h4><ul><li><b>The idea</b> in one sentence, plus a name.</li><li><b>Who plays:</b> everyone at once, the two teams, pairs, or one guest at a time.</li><li><b>Rounds:</b> how a round starts, what happens, and how it ends.</li><li><b>Each screen:</b> what guests see and tap on their phones, what the TV shows the room, and which buttons you need on the host controls (start, reveal, next, finish).</li><li><b>Timing:</b> seconds per round or turn, if any.</li><li><b>Scoring:</b> who gets points, how many, and when. Mention team points if teams compete.</li><li><b>What you might want to change later:</b> pieces, symbols, colors, lines, words, questions, time limits, points. These become <b>Quick settings</b> you can change without code.</li></ul>
 <h4>Example description</h4><p class="example">Team tic-tac-toe. The two teams take turns. The TV shows a big 3×3 board. On their turn, each guest on that team taps a square on their phone, and the most-tapped square wins the move after 15 seconds. Three in a row wins 10 points for the team. Quick settings: Team A's piece (default ❌), Team B's piece (default ⭕), use guests' pictures as pieces, board line style and color, seconds per turn, and points for a win.</p>
 <h4>Testing tips</h4><ul><li>Play every phase on the test bench and watch all three screens.</li><li>Tap "Let pretend guests play" to see how it handles a crowd.</li><li>Try odd things: tapping twice, typing nothing, a guest joining mid-round.</li><li>If something breaks, tap <b>Fix it with AI</b>. The request includes the error, so paste it into Claude and paste the new code back.</li></ul>

const fillH=s=>String(s||"").replace(/\{honorees\}/g,C().honorees||"our guests of honor");
const ordinal=n=>{n=Math.round(+n);const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

/* ---------- moment & reveal layers (persistent, so animations never restart on redraw) ---------- */
const MO={key:null,i:0,timer:null,full:{},slides:[]};
function momentSlides(m){const out=[{t:"msg"}];
 if(m.album){const a=D.album||{};Object.keys(a).sort((x,y)=>(a[y].t||0)-(a[x].t||0)).slice(0,30).forEach(k=>out.push({t:"photo",src:"album",k,name:a[k].name||""}))}
 if(m.honor){const h=D.honor||{};Object.keys(h).sort((x,y)=>(h[x].t||0)-(h[y].t||0)).forEach(k=>out.push({t:"photo",src:"honor",k,name:h[k].cap||""}))}
 if(m.wishes){const w=D.wishes||{};Object.keys(w).slice(-20).forEach(k=>out.push({t:"wish",text:w[k].text,name:w[k].name}))}
 const photos=out.slice(1);const mixed=[out[0]];photos.forEach((p,i)=>{mixed.push(p);if((i+1)%4===0)mixed.push(out[0])});return mixed}
async function slideSrc(sl){const key=sl.src+":"+sl.k;if(MO.full[key])return MO.full[key];const v=(await ER((sl.src==="album"?"albumFull/":"honorFull/")+sl.k).once("value")).val();if(v)MO.full[key]=v;return v||((D.album||{})[sl.k]||{}).thumb||((D.honor||{})[sl.k]||{}).thumb}

 if(!m){el.classList.remove("on");setTimeout(()=>{if(!MO.key)el.innerHTML=""},800);return}
 const mo=momentsList().find(x=>x.id===m.id)||{title:m.title||"",sub:""};
 el.innerHTML=`<div class="mo-bg"></div><div class="mo-orbs"><i></i><i></i><i></i><i></i></div><div class="mo-stage"><div class="mo-slide a"></div><div class="mo-slide b"></div></div><div class="mo-foot">${esc(C().title||"")} · <span>${t("Scan to join the games")}</span></div>`;
 el.classList.add("on");MO.i=0;let flip=false;
 const show=async()=>{const slides=momentSlides(mo);const sl=slides[MO.i%slides.length];MO.i++;let html;
  if(sl.t==="msg")html=`<div class="mo-msg">${C().image?`<img class="mo-art" src="${C().image}" alt="">`:""}<div class="mo-title">${esc(fillH(mo.title))}</div>${mo.sub?`<div class="mo-sub">${esc(fillH(mo.sub))}</div>`:""}</div>`;
  else if(sl.t==="wish")html=`<div class="mo-wish"><div class="mo-q">“${esc(sl.text)}”</div><div class="mo-sub">${esc(sl.name||"")}</div></div>`;
  else{const src=await slideSrc(sl);if(!src){return show()}html=`<div class="mo-photo"><img src="${src}" alt=""><div class="mo-cap">${esc(sl.name||"")}</div></div>`}
  const layers=el.querySelectorAll(".mo-slide");if(layers.length<2)return;flip=!flip;const on=layers[flip?0:1],off=layers[flip?1:0];on.innerHTML=html;on.classList.add("show");off.classList.remove("show")};
 show();MO.timer=setInterval(show,8000)}

/* ---------- photo cleanup (runs whenever a host or moderator console opens) ---------- */
async function cleanupEvent(code,days){if(!db||!(days>0))return 0;const cut=now()-days*86400000;let n=0;
 const al=(await ER("album",code).once("value")).val()||{};for(const k of Object.keys(al))if((al[k].t||0)<cut){await ER("album/"+k,code).remove();await ER("albumFull/"+k,code).remove();n++}
 const ph=(await ER("photos",code).once("value")).val()||{};for(const k of Object.keys(ph))if((ph[k].t||0)<cut&&ph[k].img){await ER("photos/"+k+"/img",code).remove();n++}
 const hn=(await ER("honor",code).once("value")).val()||{};for(const k of Object.keys(hn))if((hn[k].t||0)<cut){await ER("honor/"+k,code).remove();await ER("honorFull/"+k,code).remove();n++}
 const cm=(await ER("cgmedia",code).once("value")).val()||{};for(const k of Object.keys(cm)){const v=cm[k];const tt=v&&typeof v==="object"?v.t:0;if(!tt||tt<cut){const meta=(await ER("meta/created",code).once("value")).val()||0;if(tt?tt<cut:meta<cut){await ER("cgmedia/"+k,code).remove();n++}}}
 return n}
let cleaned=false;
async function runCleanup(){if(cleaned||!db)return;cleaned=true;try{
 if(VIEW==="moderator"&&EV&&D.content){const d=C().retentionDays!=null?+C().retentionDays:60;await cleanupEvent(EV,d)}
 if(VIEW==="host"){for(const code of Object.keys(D.events||{})){const c=(await ER("content/retentionDays",code).once("value")).val();await cleanupEvent(code,c!=null?+c:60)}}}catch(e){console.warn("cleanup",e)}}

/* balanced secret words: keep about 4 in 10 first letters as vowels */
function pickWord(){const firsts=ids().map(i=>P(i).word[0]);const vow=firsts.filter(l=>VOWELS.includes(l)).length;
 const pool=(firsts.length===0||vow/firsts.length<.38?VOWELS:CONS_ORDER).split("");
 const cnt=l=>firsts.filter(x=>x===l).length,min=Math.min(...pool.map(cnt)),ls=pool.filter(l=>cnt(l)===min);const l=ls[rnd(ls.length)];const ws=WORDBANK[l];return ws[rnd(ws.length)]}

/* trivia: majority per pod; tied pods get 15 seconds to revote; still tied means no points */
function resolveTrivia(finish){
 const list=TRV(),qi=st().tvQ||0,it=list[qi];if(!it)return;const opts=it.o,ans=it.a,pods=st().pods||{},votes=D.tv[qi]||{},rev=(D.tvr||{})[qi]||{},tie=st().tvTie||{};
 const keys=[...new Set(Object.values(pods))];const results={},newTie={};
 keys.forEach(pk=>{if((votes._res||{})[pk])return;if(finish&&!tie[pk])return;const mem=Object.keys(pods).filter(i=>pods[i]===pk);const src=finish?rev:votes;
  const tl=opts.map(()=>0);mem.forEach(i=>{if(src[i]!=null)tl[src[i]]++});const max=Math.max(...tl);
  if(max===0){results[pk]={tie:true,none:true};return}
  const tops=tl.map((n,k)=>n===max?k:-1).filter(k=>k>=0);
  if(tops.length>1){if(finish)results[pk]={tie:true};else newTie[pk]=true;return}
  const pick=tops[0],correct=pick===ans;results[pk]={pick,correct};
  const live=mem.filter(i=>D.players[i]);if(correct)award(live,pv("trivia"),pk[0],pv("trivia"));
  live.forEach(pid=>ER("streak/"+pid).transaction(v=>correct?(v||0)+1:0,(e,ok,snap)=>{if(ok&&snap&&snap.val()>=3)badge(pid,"streak3")}))});
 Object.keys(results).forEach(pk=>{if(results[pk].tie)Object.keys(pods).filter(i=>pods[i]===pk&&D.players[i]).forEach(pid=>ER("streak/"+pid).set(0))});
 const u={};Object.keys(results).forEach(pk=>u["tv/"+qi+"/_res/"+pk]=results[pk]);
 if(Object.keys(newTie).length){u["state/tvPhase"]="revote";u["state/tvTie"]=newTie;u["state/tvRevoteEnd"]=now()+15000}
 else{u["state/tvPhase"]="done";u["state/tvTie"]=null;const all=Object.assign({},votes._res||{},results);const right=Object.values(all).filter(r=>r.correct).length;
  if(right)u["state/celebrate"]={text:`${right} pod${right>1?"s":""} got it right!`,t:now()}}
 ER().update(u)}
